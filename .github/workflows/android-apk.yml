name: Build Android test APK
# Fixed download link: https://github.com/<owner>/<repo>/releases/download/test-build/starlight-odyssey.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'package.json', 'capacitor.config.json']
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Prepare Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-odyssey-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Update fixed download link (Releases > test-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk starlight-odyssey.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build starlight-odyssey.apk --prerelease --target "${{ github.sha }}" --title "Android test build" --notes "Latest build. Open starlight-odyssey.apk on an Android phone to install."
