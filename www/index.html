<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="true">
<meta name="theme-color" content="#060A1A">
<title>Starlight Odyssey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Lexend:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060A1A; --panel:#0E1530; --panel2:#152048; --line:#2A3A70; --ink:#EAF2FF; --muted:#9FB3D9; --cyan:#5CE1FF; --orange:#FF9E40; --gold:#FFC93A; --good:#5CE1A0; --bad:#FF5A6E; --violet:#B39DFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0; height:100%; overflow:hidden; background:var(--bg); touch-action:none; -webkit-user-select:none; user-select:none}
body{font-family:'Exo 2', system-ui, sans-serif; color:var(--ink)}
#wrap{position:fixed; inset:0; background:radial-gradient(ellipse at 50% 30%, #18214A 0%, #060A1A 70%)}
#stage{position:absolute; width:540px; height:960px; transform-origin:0 0; overflow:hidden; background:#060A1A; box-shadow:0 0 80px rgba(92,225,255,.08)}
#cv{position:absolute; left:0; top:0; width:540px; height:960px; display:block}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 22px; border-radius:14px; font-weight:800; font-size:18px; letter-spacing:.5px; color:#04101E;
  background:linear-gradient(180deg,#8CF0FF,#36B8E8); box-shadow:0 0 0 2px rgba(255,255,255,.15) inset, 0 6px 18px rgba(54,184,232,.35); transition:transform .08s, filter .15s}
.btn:active{transform:scale(.97)}
.btn.orange{background:linear-gradient(180deg,#FFC380,#FF8A3C); box-shadow:0 0 0 2px rgba(255,255,255,.15) inset, 0 6px 18px rgba(255,138,60,.35)}
.btn.ghost{background:rgba(255,255,255,.06); color:var(--ink); box-shadow:0 0 0 1.5px var(--line) inset}
.btn.violet{background:linear-gradient(180deg,#D4C6FF,#8E72F0)}
.btn.small{min-height:40px; font-size:15px; padding:0 14px; border-radius:11px}
.btn[disabled]{filter:grayscale(1) brightness(.6); pointer-events:none}
.hdr{font-family:Orbitron, sans-serif; font-weight:900; letter-spacing:1.5px}
svg.ic{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}

/* top HUD on the galaxy map */
#mapHud{position:absolute; left:0; right:0; top:0; height:74px; padding:10px 12px; display:flex; gap:8px; align-items:center; z-index:5; background:linear-gradient(180deg,rgba(6,10,26,.9),rgba(6,10,26,0))}
.pill{display:flex; align-items:center; gap:6px; height:38px; padding:0 12px; border-radius:12px; background:rgba(14,21,48,.85); box-shadow:0 0 0 1.5px var(--line) inset; font-weight:800; font-size:15px; white-space:nowrap}
.pill .k{font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.5px}
#hudLv{flex-direction:column; align-items:flex-start; justify-content:center; gap:3px; min-width:116px}
#hudLv .bar{width:96px; height:6px; border-radius:3px; background:#1A2244; overflow:hidden}
#hudLv .bar i{display:block; height:100%; background:linear-gradient(90deg,#5CE1FF,#B39DFF)}
#hudScrap b{color:var(--gold)} #hudShard b{color:var(--cyan)}
#hudShift{margin-left:auto}
#hudShift.warn{box-shadow:0 0 0 1.5px var(--orange) inset; color:var(--orange)}
#mapBar{position:absolute; left:10px; right:10px; bottom:12px; display:flex; gap:8px; z-index:5}
#mapBar .btn{flex:1; padding:0 6px; font-size:14px; min-height:54px; flex-direction:column; gap:2px}
#mapBar .btn svg{width:22px; height:22px}

/* battle buttons */
#bBtns{position:absolute; left:0; right:0; bottom:16px; height:0; z-index:6; pointer-events:none}
.roundBtn{position:absolute; width:72px; height:72px; border-radius:50%; pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:11px; letter-spacing:.5px; background:rgba(14,21,48,.75); box-shadow:0 0 0 2px var(--line) inset}
#btnOD{right:16px; bottom:0} #btnBomb{right:100px; bottom:0}
#btnOD.ready{box-shadow:0 0 0 3px var(--gold) inset, 0 0 24px rgba(255,201,58,.6); color:var(--gold); animation:pulse 1s infinite}
#btnPause{position:absolute; right:12px; top:74px; width:44px; height:44px; border-radius:12px; background:rgba(14,21,48,.7); box-shadow:0 0 0 1.5px var(--line) inset; pointer-events:auto; display:flex; align-items:center; justify-content:center}
@keyframes pulse{50%{transform:scale(1.06)}}
.odRing{position:absolute; inset:4px; border-radius:50%; background:conic-gradient(var(--gold) calc(var(--p)*1%), transparent 0); -webkit-mask:radial-gradient(circle, transparent 29px, #000 30px); mask:radial-gradient(circle, transparent 29px, #000 30px)}

/* overlays */
.ov{position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:14px; background:rgba(3,6,16,.72); backdrop-filter:blur(2px)}
.card{width:100%; max-width:512px; max-height:932px; overflow:auto; background:linear-gradient(180deg,var(--panel2),var(--panel)); border-radius:22px; box-shadow:0 0 0 1.5px var(--line) inset, 0 20px 60px rgba(0,0,0,.5); padding:20px}
.card h2{margin:0 0 6px; font-family:Orbitron, sans-serif; font-size:24px; letter-spacing:1px}
.card .sub{color:var(--muted); font-size:15px; margin-bottom:12px; line-height:1.4}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.right{margin-left:auto}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.box{background:rgba(255,255,255,.04); border-radius:14px; box-shadow:0 0 0 1px var(--line) inset; padding:12px}
.box .k{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.5px; text-transform:uppercase}
.box .v{font-family:Orbitron, sans-serif; font-size:22px; margin-top:4px}
.bar{height:10px; border-radius:5px; background:#1A2244; overflow:hidden}
.bar i{display:block; height:100%}
.chip{display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:8px; font-size:12px; font-weight:800; letter-spacing:.5px; color:#04101E}

/* dialogue */
#dlg{position:absolute; left:10px; right:10px; bottom:12px; z-index:30; display:flex; gap:12px; padding:14px; min-height:170px; border-radius:20px; background:linear-gradient(180deg,rgba(21,32,72,.97),rgba(14,21,48,.97)); box-shadow:0 0 0 1.5px var(--line) inset, 0 10px 40px rgba(0,0,0,.5); cursor:pointer}
#dlgFace{width:110px; height:110px; flex:none; border-radius:16px; background:radial-gradient(circle at 50% 40%, #233466, #0B1230); box-shadow:0 0 0 1.5px var(--line) inset}
#dlgName{font-family:Orbitron, sans-serif; font-size:14px; letter-spacing:1px; margin-bottom:6px}
#dlgText{font-family:Lexend, sans-serif; font-size:19px; line-height:1.45; min-height:80px}
#dlgNext{position:absolute; right:16px; bottom:10px; font-size:12px; color:var(--muted); animation:bob 1s infinite}
#dlgSkip{position:absolute; right:12px; top:-44px; pointer-events:auto}
@keyframes bob{50%{transform:translateY(-3px)}}
#dlg.narr #dlgFace{display:none}
#dlg.narr #dlgText{font-style:italic; color:#C9D6FF}

/* question */
#q .card{padding:16px 18px 18px}
.qTop{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.qTopic{font-size:13px; color:var(--muted); font-weight:700}
.qDiff{margin-left:auto; display:flex; gap:3px}
.qDiff i{width:9px; height:9px; border-radius:2px; background:#2A3A70; transform:rotate(45deg)}
.qDiff i.on{background:var(--gold)}
#qWho{font-size:14px; font-weight:700; color:var(--cyan); margin-bottom:6px}
#qText{font-family:Lexend, sans-serif; font-size:21px; line-height:1.45; white-space:pre-line; margin:2px 0 14px; display:flex; gap:10px; align-items:flex-start}
#qText span{flex:1}
#qChoices{display:grid; gap:10px}
.choice{display:flex; align-items:center; gap:12px; text-align:left; min-height:56px; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.05); box-shadow:0 0 0 1.5px var(--line) inset; font-family:Lexend, sans-serif; font-size:18px; line-height:1.3; transition:background .12s}
.choice:hover{background:rgba(92,225,255,.08)}
.choice .key{flex:none; width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:Orbitron, sans-serif; font-size:13px; background:#1A2244; color:var(--cyan)}
.choice.ok{background:rgba(92,225,160,.18); box-shadow:0 0 0 2px var(--good) inset}
.choice.ok .key{background:var(--good); color:#04101E}
.choice.no{background:rgba(255,90,110,.14); box-shadow:0 0 0 2px var(--bad) inset; opacity:.85}
.choice.gone{opacity:.25; pointer-events:none; text-decoration:line-through}
.choice[disabled]{pointer-events:none}
#qFeed{margin-top:12px; border-radius:14px; padding:12px 14px; font-family:Lexend, sans-serif; font-size:16px; line-height:1.5}
#qFeed.good{background:rgba(92,225,160,.12); box-shadow:0 0 0 1.5px rgba(92,225,160,.5) inset}
#qFeed.bad{background:rgba(255,90,110,.1); box-shadow:0 0 0 1.5px rgba(255,90,110,.45) inset}
#qFeed b{font-family:'Exo 2', sans-serif; font-size:18px}
#qFeed .rw{margin-top:8px; font-family:'Exo 2', sans-serif; font-weight:800; color:var(--gold); font-size:14px}
.qBar{display:flex; gap:8px; align-items:center; margin-top:14px}
#qTimer{width:40px; height:40px; position:relative; flex:none}
#qTimer svg{width:40px; height:40px; transform:rotate(-90deg)}
#qTimer span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--gold)}
#qTimerLbl{font-size:12px; color:var(--muted); font-weight:700; line-height:1.2}
.spk{width:40px; height:40px; flex:none; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; background:rgba(92,225,255,.12); color:var(--cyan); box-shadow:0 0 0 1.5px rgba(92,225,255,.4) inset}

/* cards choice */
#cards .card{background:transparent; box-shadow:none; padding:0; max-width:520px}
.cardRow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.pcard{position:relative; min-height:250px; border-radius:18px; padding:14px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; background:linear-gradient(180deg,#1A2654,#0E1530); box-shadow:0 0 0 2px var(--tc) inset, 0 0 28px color-mix(in srgb, var(--tc) 40%, transparent); animation:deal .35s backwards}
.pcard:active{transform:scale(.97)}
.pcard .tier{font-size:11px; font-weight:800; letter-spacing:1px; color:var(--tc)}
.pcard canvas{width:84px; height:84px}
.pcard .nm{font-family:Orbitron, sans-serif; font-size:15px; line-height:1.2}
.pcard .ds{font-size:14px; color:#C9D6FF; line-height:1.35}
@keyframes deal{from{transform:translateY(30px) scale(.9); opacity:0}}
#cardsTitle{text-align:center; margin-bottom:14px}
#cardsTitle .hdr{font-size:26px}
#cardsTitle .sub{color:var(--muted); margin-top:4px}

/* node info, station, etc. */
.tabRow{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto}
.tab{flex:1; min-height:40px; border-radius:11px; font-weight:800; font-size:14px; background:rgba(255,255,255,.04); box-shadow:0 0 0 1.5px var(--line) inset; white-space:nowrap; padding:0 10px}
.tab.on{background:rgba(92,225,255,.16); box-shadow:0 0 0 2px var(--cyan) inset; color:var(--cyan)}
.item{display:flex; gap:12px; align-items:center; padding:12px; border-radius:14px; background:rgba(255,255,255,.04); box-shadow:0 0 0 1px var(--line) inset; margin-bottom:8px}
.item .nm{font-weight:800; font-size:16px}
.item .ds{font-size:13px; color:var(--muted); line-height:1.35; margin-top:2px}
.item .lv{color:var(--gold); font-weight:800; font-size:13px}
.skillGrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.skill{border-radius:14px; padding:10px 12px; background:rgba(255,255,255,.04); box-shadow:0 0 0 1px var(--line) inset}
.skill .pips{display:flex; gap:4px; margin:6px 0}
.skill .pips i{width:16px; height:6px; border-radius:3px; background:#2A3A70}
.skill .pips i.on{background:var(--bc)}
.codexGrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.cdx{border-radius:12px; padding:10px; min-height:96px; font-size:13px; line-height:1.4; background:rgba(255,255,255,.04); box-shadow:0 0 0 1px var(--line) inset}
.cdx b{display:block; font-size:14px; margin-bottom:4px}
.cdx.locked{color:#4A5A80; display:flex; align-items:center; justify-content:center; font-family:Orbitron, sans-serif}
table.rep{width:100%; border-collapse:collapse; font-size:14px}
table.rep th, table.rep td{padding:8px 4px; text-align:left; border-bottom:1px solid #1E2A55}
table.rep th{color:var(--muted); font-size:12px; font-weight:700}
.mist{padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); box-shadow:0 0 0 1px var(--line) inset; margin-bottom:8px; font-size:14px; line-height:1.45; font-family:Lexend, sans-serif}
.days{display:flex; gap:6px; align-items:flex-end; height:90px; margin-top:8px}
.days div{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--muted)}
.days i{display:block; width:100%; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg,#5CE1FF,#2C6BED); min-height:3px}
.seg{display:flex; gap:6px}
.seg button{flex:1; min-height:42px; border-radius:11px; font-weight:800; background:rgba(255,255,255,.04); box-shadow:0 0 0 1.5px var(--line) inset}
.seg button.on{background:rgba(92,225,255,.16); box-shadow:0 0 0 2px var(--cyan) inset; color:var(--cyan)}
.setRow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid #1E2A55; font-weight:700}
input[type=range]{width:160px; accent-color:var(--cyan)}
.tgl{width:58px; height:32px; border-radius:16px; background:#2A3A70; position:relative; flex:none}
.tgl:after{content:''; position:absolute; left:4px; top:4px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s}
.tgl.on{background:var(--cyan)} .tgl.on:after{left:30px}

/* title */
#title{position:absolute; inset:0; z-index:15; pointer-events:none; display:flex; flex-direction:column; align-items:center}
#title > *{pointer-events:auto}
.logo{margin-top:120px; text-align:center}
.logo .a{font-family:Orbitron, sans-serif; font-weight:900; font-size:50px; line-height:1; letter-spacing:3px; background:linear-gradient(180deg,#FFFFFF,#8CF0FF 55%,#2C6BED); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(92,225,255,.45))}
.logo .b{font-family:Orbitron, sans-serif; font-weight:900; font-size:52px; line-height:1.05; letter-spacing:4px; color:var(--orange); filter:drop-shadow(0 0 14px rgba(255,158,64,.5))}
.logo .c{margin-top:10px; font-weight:800; font-size:18px; letter-spacing:6px; color:#C9D6FF}
.tBtns{position:absolute; left:44px; right:44px; bottom:46px; display:flex; flex-direction:column; gap:10px}
.tInfo{text-align:center; font-size:14px; color:var(--muted); min-height:20px; line-height:1.4}
.tInfo b{color:var(--gold)}

#toast{position:absolute; left:50%; top:92px; transform:translateX(-50%); z-index:40; max-width:500px; padding:10px 16px; border-radius:14px; background:rgba(14,21,48,.95); box-shadow:0 0 0 1.5px var(--cyan) inset; font-size:15px; font-weight:700; text-align:center; pointer-events:none; transition:opacity .3s}
#nodeInfo{position:absolute; left:10px; right:10px; bottom:80px; z-index:7}
#nodeInfo .card{padding:16px}
.nodeType{font-family:Orbitron, sans-serif; font-size:20px}




/* ---------- title art & motion (Higgsfield) ---------- */
#titleMedia{position:absolute; inset:0; z-index:-1; pointer-events:none!important; overflow:hidden; opacity:0; transition:opacity .7s; background:#000}
#titleMedia.ready{opacity:1}
#titleMedia img, #titleMedia video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
#titleMedia .blur{filter:blur(28px) brightness(.7); transform:scale(1.15); display:none}
#titleMedia video{opacity:0; transition:opacity .9s}
#titleMedia.moving video{opacity:1}
#titleMedia .shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(4,8,26,.62) 0%, rgba(4,8,26,0) 34%, rgba(4,8,26,0) 56%, rgba(4,8,26,.82) 100%)}
@media (min-aspect-ratio: 4/5){ #titleMedia .blur{display:block} #titleMedia .main, #titleMedia video{object-fit:contain} }
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="cv" width="540" height="960"></canvas>

  <div id="mapHud" hidden>
    <div class="pill" id="hudLv"><span><span class="k">LV</span> <b id="hudLvN">1</b> <span class="k" id="hudRank">CADET</span></span><span class="bar"><i id="hudXp" style="width:0%"></i></span></div>
    <div class="pill" id="hudScrap"><svg class="ic" viewBox="0 0 24 24" style="color:#FFC93A;width:16px;height:16px"><path d="M12 2l4 10-4 10-4-10z"/></svg><b>0</b></div>
    <div class="pill" id="hudShard"><svg class="ic" viewBox="0 0 24 24" style="color:#5CE1FF;width:16px;height:16px"><path d="M12 2l6 7-6 13-6-13z"/></svg><b>0/7</b></div>
    <div class="pill" id="hudShift" title="Shift time"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b id="hudShiftT">30:00</b></div>
  </div>
  <div id="mapBar" hidden>
    <button class="btn ghost" id="mbShip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l3 7v8l-3 3-3-3V9z"/><path d="M9 13l-5 4M15 13l5 4"/></svg>Ship</button>
    <button class="btn ghost" id="mbCrew"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 20c.3-2.6 1.7-4.5 4-4.5 1.3 0 2 .5 2 .5"/></svg>Crew</button>
    <button class="btn ghost" id="mbCodex"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h8M8 12h6"/></svg>Codex</button>
    <button class="btn ghost" id="mbLog"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Log</button>
    <button class="btn ghost" id="mbMenu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </div>
  <div id="nodeInfo" hidden><div class="card"><div class="row"><div class="nodeType" id="niType"></div><span class="chip right" id="niChip"></span></div><div class="sub" id="niDesc" style="margin:8px 0 12px"></div><div class="row"><button class="btn ghost small" id="niCancel">Back</button><button class="btn orange right" id="niGo">Launch</button></div></div></div>

  <div id="bBtns" hidden>
    <button class="roundBtn" id="btnBomb"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 6V3M17 8l2-2"/></svg><span>NOVA <b id="bombN">1</b></span></button>
    <button class="roundBtn" id="btnOD"><i class="odRing" id="odRing" style="--p:0"></i><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>OVERDRIVE</span></button>
    <button id="btnPause" aria-label="Pause"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>

  <div id="title" hidden>
    <div id="titleMedia" aria-hidden="true" data-img='["media/title.png", "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_192145_3df6b395-0015-41d2-86df-13ad9b80aca1.png"]' data-vid='["media/title.mp4", "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_193333_77d88e18-a0f8-40c8-865f-2b5f5efcf9f9.mp4"]'><img class="blur" alt=""><img class="main" alt=""><video muted loop playsinline preload="auto"></video><div class="shade"></div></div>
    
    
    
    <div class="logo"><div class="a">STARLIGHT</div><div class="b">ODYSSEY</div><div class="c">HAJUN'S QUEST</div></div>

    if (ch === 'k' || ch === 'x'){ const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(150, when); o.frequency.exponentialRampToValueAtTime(40, when + .13); g.gain.setValueAtTime(.38, when); g.gain.exponentialRampToValueAtTime(.001, when + .22); o.connect(g); g.connect(out); o.start(when); o.stop(when + .24); }
    if (ch === 's'){ const n = c.createBufferSource(); n.buffer = this.noise; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = .6; const g = c.createGain(); g.gain.setValueAtTime(.2, when); g.gain.exponentialRampToValueAtTime(.001, when + .16); n.connect(f); f.connect(g); g.connect(out); n.start(when, Math.random() * .5); n.stop(when + .18);
      const o = c.createOscillator(), g2 = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, when); g2.gain.setValueAtTime(.08, when); g2.gain.exponentialRampToValueAtTime(.001, when + .08); o.connect(g2); g2.connect(out); o.start(when); o.stop(when + .1); }
    if (ch === 'h' || ch === 'x'){ const n = c.createBufferSource(); n.buffer = this.noise; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500; const g = c.createGain(); g.gain.setValueAtTime(.06, when); g.gain.exponentialRampToValueAtTime(.001, when + .04); n.connect(f); f.connect(g); g.connect(out); n.start(when, Math.random() * .5); n.stop(when + .06); }
  },
  schedule(t, step, when, stepDur){
    const d = t.def, out = t.out;
    for (const e of d._mel.ev) if (e.step === step % d._mel.steps){
      const dur = e.len * stepDur * .95;
      this.voice(d.lead, mtof(e.midi), when, dur, d.leadVol, out, { vib: !d.bell && e.len > 2, attack: d.bell ? .005 : .02, release: d.bell ? .6 : .12 });
      if (d.lead === 'sawtooth') this.voice('sawtooth', mtof(e.midi), when, dur, d.leadVol * .6, out, { detune: 9, attack: .02, release: .12 });
      if (d.bell) this.voice('sine', mtof(e.midi + 12), when, dur * .6, d.leadVol * .25, out, { attack: .003, release: .5 });
    }
    for (const e of d._bass.ev) if (e.step === step % d._bass.steps) this.voice(d.bassType, mtof(e.midi), when, e.len * stepDur * .9, d.bassVol, out, { attack: .01, release: .06 });
    const chord = d._chords[Math.floor(step / 8) % d._chords.length] || [];
    if (d.pad && step % 8 === 0) for (const m of chord){ this.voice('sine', mtof(m), when, stepDur * 8, d.pad / 2, out, { attack: .4, release: .6 }); this.voice('triangle', mtof(m - 12), when, stepDur * 8, d.pad / 4, out, { attack: .5, release: .6 }); }
    if (d.arp && chord.length){ const seq = [0, 1, 2, 1]; for (let k = 0; k < 2; k++){ const m = chord[seq[(step * 2 + k) % 4]] + 12; this.voice('square', mtof(m), when + k * stepDur / 2, stepDur * .4, d.arp, out, { pluck: true, attack: .003, release: .05 }); } }
    if (d.drums){ const ch = d.drums[step % d.drums.length]; if (ch && ch !== '.') this.drum(ch, when, out); }
  },
  sfx(name, opt){
    if (!this.ctx || this.sfxVol <= 0) return;
    const c = this.ctx, now = c.currentTime;
    const gap = { shoot: .07, shoot2: .08, hit: .04, explodeS: .05, pickup: .05, beam: .12, missile: .1, type: .045 }[name];
    if (gap && this.last[name] && now - this.last[name] < gap) return;
    this.last[name] = now;
    const t = now + .005, out = this.sfxBus;
    const v = (type, f, w, d, vol, o) => this.voice(type, f, t + w, d, vol, out, o);
    const sweep = (type, f1, f2, w, d, vol) => { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t + w); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + w + d); g.gain.setValueAtTime(vol, t + w); g.gain.exponentialRampToValueAtTime(.001, t + w + d); o.connect(g); g.connect(out); o.start(t + w); o.stop(t + w + d + .05); };
    const noise = (w, d, vol, ftype, f1, f2) => { const n = c.createBufferSource(); n.buffer = this.noise; const f = c.createBiquadFilter(); f.type = ftype; f.frequency.setValueAtTime(f1, t + w); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + w + d); const g = c.createGain(); g.gain.setValueAtTime(vol, t + w); g.gain.exponentialRampToValueAtTime(.001, t + w + d); n.connect(f); f.connect(g); g.connect(out); n.start(t + w, Math.random() * .4); n.stop(t + w + d + .05); };
    switch (name){
      case 'tap': v('square', 900, 0, .02, .04); break;
      case 'select': v('triangle', 760, 0, .05, .09); v('triangle', 1140, .04, .05, .06); break;
      case 'confirm': v('triangle', 660, 0, .06, .12); v('triangle', 990, .06, .1, .12); break;
      case 'cancel': v('triangle', 520, 0, .06, .1); v('triangle', 350, .06, .08, .1); break;
      case 'type': v('square', opt || 1200, 0, .015, .025); break;
      case 'shoot': sweep('square', 1400, 420, 0, .07, .035); break;
      case 'shoot2': sweep('sawtooth', 900, 300, 0, .09, .03); break;
      case 'beam': sweep('sawtooth', 300, 900, 0, .14, .03); noise(0, .12, .02, 'bandpass', 3000); break;
      case 'missile': noise(0, .25, .05, 'bandpass', 800, 2400); sweep('triangle', 200, 600, 0, .2, .04); break;
      case 'zap': sweep('square', 2000, 200, 0, .12, .04); break;
      case 'hit': v('square', 180 + Math.random() * 60, 0, .03, .05); break;
      case 'explodeS': noise(0, .25, .16, 'lowpass', 1800, 200); sweep('sine', 180, 50, 0, .2, .12); break;
      case 'explodeL': noise(0, .9, .3, 'lowpass', 1400, 80); sweep('sine', 120, 30, 0, .8, .25); noise(.1, .5, .1, 'bandpass', 600, 150); break;
      case 'playerHit': noise(0, .2, .2, 'bandpass', 900, 300); sweep('square', 400, 100, 0, .2, .08); break;
      case 'shieldHit': sweep('sine', 1400, 700, 0, .15, .08); noise(0, .1, .05, 'highpass', 5000); break;
      case 'shieldUp': [600, 900, 1350].forEach((f, i) => v('sine', f, i * .05, .15, .07)); break;
      case 'pickup': v('square', 1568, 0, .04, .045); v('square', 2093, .04, .06, .045); break;
      case 'powerup': [523, 659, 784, 1047, 1319].forEach((f, i) => v('square', f, i * .05, .08, .06)); break;
      case 'cache': [1175, 1568, 2349].forEach((f, i) => v('sine', f, i * .07, .3, .08, { release: .4 })); break;
      case 'correct': [1046, 1318, 1568, 2093].forEach((f, i) => v('sine', f, i * .07, .3, .11, { release: .3 })); v('triangle', 523, 0, .4, .06); break;
      case 'wrong': sweep('triangle', 420, 200, 0, .3, .13); v('square', 160, .18, .18, .05); break;
      case 'streak': [784, 988, 1175, 1568, 1976].forEach((f, i) => v('square', f, i * .045, .1, .055)); break;
      case 'levelup': [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => v('square', f, i * .07, .12, .06)); v('triangle', 262, 0, .6, .1); break;
      case 'warp': sweep('sawtooth', 80, 1600, 0, 1.0, .06); noise(0, 1, .06, 'bandpass', 300, 5000); break;
      case 'alarm': for (let i = 0; i < 3; i++){ sweep('square', 880, 440, i * .32, .28, .07); } break;
      case 'roar': sweep('sawtooth', 160, 60, 0, .9, .14); noise(0, .9, .12, 'lowpass', 700, 120); break;
      case 'bomb': sweep('sine', 900, 40, 0, 1.0, .2); noise(0, 1, .25, 'lowpass', 3000, 100); break;
      case 'heal': [660, 880, 1100, 1320].forEach((f, i) => v('sine', f, i * .06, .2, .07)); break;
      case 'lock': v('square', 220, 0, .06, .1); noise(0, .08, .12, 'bandpass', 2500); v('square', 330, .1, .08, .08); break;
      case 'break': noise(0, .5, .2, 'highpass', 2000, 6000); [1568, 1175, 784].forEach((f, i) => v('triangle', f, i * .06, .2, .08)); break;
      case 'unlock': [523, 659, 784, 1047, 1319].forEach((f, i) => v('sine', f, i * .08, .25, .08, { release: .3 })); break;
      case 'coin': v('square', 1975, 0, .04, .05); v('square', 2637, .04, .1, .05); break;
      case 'page': noise(0, .15, .06, 'bandpass', 4000, 1500); break;
      case 'chime': [1568, 2093].forEach((f, i) => v('sine', f, i * .12, .5, .08, { release: .6 })); break;
      case 'tick': v('square', 2400, 0, .01, .02); break;
    }
  }
};

/* =========================================================
   Adaptive learning engine
   - Elo rating per subject (player) vs. item difficulty
   - Targets ~65% success ("mid-upper" challenge), with occasional stretch items
   - Review queue: missed questions come back a few questions later
   ========================================================= */
const SUBJECTS = {
  math: { name: 'Math', color: '#4FC3F7', std: 'Common Core Math 6–8' },
  sci:  { name: 'Science', color: '#7CE38B', std: 'NGSS Middle School' },
  ela:  { name: 'English', color: '#FFB74D', std: 'Common Core ELA 6–8' },
  ush:  { name: 'U.S. History', color: '#FF7A90', std: 'U.S. History survey (C3)' },
  civ:  { name: 'Civics & Society', color: '#B39DFF', std: 'Civics, Geography, Economics (C3)' },
  wh:   { name: 'World History', color: '#FFD54F', std: 'World History, ancient–early modern' },
};
const SUBJ_KEYS = Object.keys(SUBJECTS);
const ITEM_ELO = d => 750 + d * 150;               // d1=900 … d5=1500
const START_ELO = { 6: 1150, 7: 1300, 8: 1450 };
const RANKS = [[0, 'Cadet'], [1000, 'Ensign'], [1150, 'Lieutenant'], [1300, 'Commander'], [1450, 'Captain'], [1600, 'Admiral']];
const rankOf = r => RANKS.filter(x => r >= x[0]).pop()[1];
const gradeEst = r => r < 1050 ? 'Grade 6 (building)' : r < 1200 ? 'Grade 6' : r < 1350 ? 'Grade 7' : r < 1500 ? 'Grade 8' : 'Beyond Grade 8';

// Build static item index once
const ITEMS = {};
(function buildItems(){
  const src = { sci: BANK_SCI, ela: BANK_ELA, ush: BANK_USH, civ: BANK_CIV, wh: BANK_WH, math: BANK_MATH_STATIC };
  for (const s of Object.keys(src)) src[s].forEach((it, i) => {
    const [topic, d, q, a, w1, w2, w3, e] = it;
    ITEMS[`${s}:${i}`] = { id: `${s}:${i}`, subj: s, topic, d, elo: ITEM_ELO(d), q, a, w: [w1, w2, w3].filter(x => x !== '' && x != null), e };
  });
  for (const g of MATH_GEN) ITEMS[`gen:${g.id}`] = { id: `gen:${g.id}`, subj: 'math', topic: g.topic, d: g.d, elo: ITEM_ELO(g.d), gen: g };
})();
const ITEM_LIST = Object.values(ITEMS);

function newLearn(grade){
  const r = START_ELO[grade] || 1300, rating = {}, n = {};
  SUBJ_KEYS.forEach(s => { rating[s] = r; n[s] = 0; });
  return { grade, rating, n, seen: {}, counter: 0, review: [], stats: {}, topics: {}, log: [], streak: 0, bestStreak: 0, mistakes: [], daily: {} };
}
const expectP = (rp, ri) => 1 / (1 + Math.pow(10, (ri - rp) / 400));

const Learn = {
  L: null,
  attach(L){ this.L = L; },
  // choose a subject: focus subject gets ~45%, weaker subjects get a little extra weight
  chooseSubject(focus){
    const L = this.L;
    if (focus && focus !== 'mix' && Math.random() < .5) return focus;
    const w = SUBJ_KEYS.map(s => { const st = L.stats[s]; const acc = st && st.att >= 4 ? st.ok / st.att : .7; return 1 + (1 - acc) * 1.2 + (s === focus ? .5 : 0); });
    let x = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < SUBJ_KEYS.length; i++){ x -= w[i]; if (x <= 0) return SUBJ_KEYS[i]; }
    return SUBJ_KEYS[0];
  },
  next(opts = {}){
    const L = this.L;
    L.counter++;
    // 1) due review item
    const due = L.review.filter(r => r.due <= L.counter && (!opts.subj || ITEMS[r.id].subj === opts.subj));
    if (due.length && Math.random() < .6 && !opts.noReview){
      const r = due[0]; return this.materialize(ITEMS[r.id], { review: true, reviewSeed: r.seed });
    }
    const subj = opts.subj || this.chooseSubject(opts.focus);
    const rp = L.rating[subj];
    const stretch = opts.stretch ?? Math.random() < .18;
    const target = rp - 120 + (stretch ? 200 : 0) + (opts.harder ? 100 : 0);
    let pool = ITEM_LIST.filter(it => it.subj === subj && !(L.seen[it.id] && !it.gen && L.counter - L.seen[it.id] < 120));
    if (subj === 'math' && Math.random() < .55) pool = pool.filter(it => it.gen);
    else if (subj === 'math') pool = pool.filter(it => !it.gen || Math.random() < .2);
    if (!pool.length) pool = ITEM_LIST.filter(it => it.subj === subj);
    // score by distance to target, small random jitter, and prefer less-seen
    const scored = pool.map(it => ({ it, s: Math.abs(it.elo - target) + Math.random() * 110 + (L.seen[it.id] ? 60 : 0) }));
    scored.sort((a, b) => a.s - b.s);
    const it = scored[0].it;
    return this.materialize(it, { stretch: it.elo > rp });
  },
  materialize(it, extra = {}){
    let q, a, w, e;
    if (it.gen){
      const r = it.gen.make(); if (!r) return this.next({ subj: 'math', noReview: true });
      ({ q, a, w, e } = r);
    } else { ({ q, a, w, e } = it); }
    return { id: it.id, subj: it.subj, topic: it.topic, d: it.d, elo: it.elo, q, answer: a, choices: shuffle([a, ...w]), e, ...extra };
  },
  // returns detailed result for reward logic
  record(Q, correct, ms, hinted){
    const L = this.L, s = Q.subj, rp = L.rating[s], p = expectP(rp, Q.elo);
    const n = L.n[s] = (L.n[s] || 0) + 1;
    const K = n < 15 ? 48 : n < 40 ? 32 : 22;
    const score = correct ? (hinted ? .6 : 1) : 0;
    L.rating[s] = clamp(Math.round(rp + K * (score - p)), 700, 1850);
    L.seen[Q.id] = L.counter;
    const st = L.stats[s] = L.stats[s] || { att: 0, ok: 0, ms: 0 }; st.att++; if (correct) st.ok++; st.ms += ms;
    const tk = `${s}|${Q.topic}`, tp = L.topics[tk] = L.topics[tk] || { att: 0, ok: 0 }; tp.att++; if (correct) tp.ok++;
    const day = new Date().toISOString().slice(0, 10), dd = L.daily[day] = L.daily[day] || { att: 0, ok: 0, ms: 0 }; dd.att++; if (correct) dd.ok++; dd.ms += ms;
    let redemption = false;
    if (Q.review){ const i = L.review.findIndex(r => r.id === Q.id); if (i >= 0){ if (correct){ L.review.splice(i, 1); redemption = true; } else { L.review[i].due = L.counter + irand(5, 10); L.review[i].tries++; } } }
    else if (!correct && !Q.id.startsWith('gen:')){ if (!L.review.some(r => r.id === Q.id)) L.review.push({ id: Q.id, due: L.counter + irand(4, 9), tries: 0 }); }
    else if (!correct && Q.id.startsWith('gen:')){ if (!L.review.some(r => r.id === Q.id)) L.review.push({ id: Q.id, due: L.counter + irand(4, 9), tries: 0 }); }
    if (L.review.length > 40) L.review.shift();
    if (correct){ L.streak++; L.bestStreak = Math.max(L.bestStreak, L.streak); } else L.streak = 0;
    if (!correct){ L.mistakes.unshift({ subj: s, topic: Q.topic, q: Q.q, a: Q.answer, e: Q.e, t: Date.now() }); L.mistakes = L.mistakes.slice(0, 40); }
    L.log.push({ s, ok: correct ? 1 : 0, d: Q.d, t: Date.now() }); if (L.log.length > 300) L.log.shift();
    const challenge = Q.elo - rp; // >0 means harder than player's level
    return { correct, p, challenge, hard: challenge > 60, easy: challenge < -200, redemption, streak: L.streak, delta: L.rating[s] - rp };
  },
  overall(){ const L = this.L; return Math.round(SUBJ_KEYS.reduce((a, s) => a + L.rating[s], 0) / SUBJ_KEYS.length); },
  weakTopics(n = 5){
    const L = this.L;
    return Object.entries(L.topics).filter(([, v]) => v.att >= 3).map(([k, v]) => ({ k, subj: k.split('|')[0], topic: k.split('|')[1], acc: v.ok / v.att, att: v.att })).sort((a, b) => a.acc - b.acc).slice(0, n);
  },
};

/* =========================================================
   Procedural art: ships, Null enemies, bosses, backgrounds, portraits
   ========================================================= */
const TAU = Math.PI * 2;
function rr(g, x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function ell(g, x, y, rx, ry, rot = 0){ g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function poly(g, pts){ g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function shade(hex, amt){
  let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.slice(0, 2), 16), gg = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((f - r) * p + r); gg = Math.round((f - gg) * p + gg); b = Math.round((f - b) * p + b);
  return '#' + [r, gg, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a){ let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return `rgba(${parseInt(c.slice(0, 2), 16)},${parseInt(c.slice(2, 4), 16)},${parseInt(c.slice(4, 6), 16)},${a})`; }

/* glow sprites (cached radial gradients, drawn with 'lighter') */
const GLOW = {};
function glowSprite(color, r){
  const k = color + r; if (GLOW[k]) return GLOW[k];
  const c = document.createElement('canvas'); c.width = c.height = r * 2; const x = c.getContext('2d');
  const gr = x.createRadialGradient(r, r, 0, r, r, r); gr.addColorStop(0, rgba(color, .9)); gr.addColorStop(.25, rgba(color, .45)); gr.addColorStop(1, rgba(color, 0));
  x.fillStyle = gr; x.fillRect(0, 0, r * 2, r * 2); GLOW[k] = c; return c;
}
function glow(g, x, y, r, color, a = 1){ const s = glowSprite(color, Math.max(4, Math.round(r / 4) * 4)); g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.drawImage(s, x - r, y - r, r * 2, r * 2); g.restore(); }

/* ---------- player ship: the Comet ---------- */
function drawShip(g, x, y, s, t, o = {}){
  g.save(); g.translate(x, y); g.rotate((o.tilt || 0) * .25); const k = s / 50; g.scale(k, k);
  // engine flames
  const fl = 14 + Math.sin(t * 40) * 3 + (o.thrust || 0) * 10;
  for (const ex of [-9, 9]){
    glow(g, ex, 22, 16, o.od ? '#FFD45C' : '#FF8A3C', .9);
    g.fillStyle = o.od ? '#FFF2A8' : '#FFB46B'; g.beginPath(); g.moveTo(ex - 4, 18); g.quadraticCurveTo(ex, 18 + fl * 1.3, ex + 4, 18); g.fill();
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.moveTo(ex - 2, 18); g.quadraticCurveTo(ex, 18 + fl * .6, ex + 2, 18); g.fill();
  }
  // wings
  const wingC = '#233A7A';
  poly(g, [[-6, -2], [-30, 14], [-31, 20], [-22, 20], [-6, 12]]); g.fillStyle = wingC; g.fill(); g.strokeStyle = '#0B1430'; g.lineWidth = 1.5; g.stroke();
  poly(g, [[6, -2], [30, 14], [31, 20], [22, 20], [6, 12]]); g.fill(); g.stroke();
  g.fillStyle = '#FF8A3C'; poly(g, [[-30, 14], [-31, 20], [-26, 20]]); g.fill(); poly(g, [[30, 14], [31, 20], [26, 20]]); g.fill();
  g.strokeStyle = '#4FC3F7'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-9, 4); g.lineTo(-24, 15); g.moveTo(9, 4); g.lineTo(24, 15); g.stroke();
  // weapon mods
  const wc = WEAPONS[o.weapon || 'pulse'].color;
  if (o.weapon === 'spread'){ for (const sx of [-28, 28]){ rr(g, sx - 2.5, 8, 5, 9, 2); g.fillStyle = '#FFD45C'; g.fill(); glow(g, sx, 8, 6, '#FFD45C', .7); } }
  if (o.weapon === 'seeker'){ for (const sx of [-18, 18]){ rr(g, sx - 3, 4, 6, 14, 3); g.fillStyle = '#D8DEE8'; g.fill(); g.fillStyle = '#FF5A3C'; g.fillRect(sx - 3, 4, 6, 4); } }
  if (o.weapon === 'arc'){ g.strokeStyle = '#8CFFB0'; g.lineWidth = 2; for (const sx of [-17, 17]){ g.beginPath(); g.arc(sx, 10, 4, 0, TAU); g.stroke(); } }
  // nacelles
  for (const ex of [-9, 9]){ rr(g, ex - 5, 6, 10, 15, 4); g.fillStyle = '#B9C4D8'; g.fill(); g.strokeStyle = '#0B1430'; g.stroke(); g.fillStyle = '#5A6680'; g.fillRect(ex - 4, 17, 8, 3); }
  // fuselage
  const fg = g.createLinearGradient(-8, 0, 8, 0); fg.addColorStop(0, '#C9D3E6'); fg.addColorStop(.5, '#FFFFFF'); fg.addColorStop(1, '#AEB9CF');
  g.beginPath(); g.moveTo(0, -28); g.bezierCurveTo(7, -18, 9, 0, 8, 16); g.lineTo(-8, 16); g.bezierCurveTo(-9, 0, -7, -18, 0, -28); g.fillStyle = fg; g.fill(); g.strokeStyle = '#0B1430'; g.lineWidth = 1.6; g.stroke();

/* ---------- Null enemies (dark crystal bodies with glowing cores) ---------- */
const NULL_BODY = '#1C1230', NULL_EDGE = '#3B2A5C';
function crystal(g, pts, light){
  poly(g, pts); const gr = g.createLinearGradient(0, -20, 0, 20); gr.addColorStop(0, light || '#3A2A5E'); gr.addColorStop(1, NULL_BODY); g.fillStyle = gr; g.fill();
  g.strokeStyle = NULL_EDGE; g.lineWidth = 1.5; g.stroke();
}
function drawEnemy(g, kind, x, y, r, t, accent, flash, ang = 0){
  g.save(); g.translate(x, y); const k = r / 20; g.scale(k, k);
  const pulse = .7 + .3 * Math.sin(t * 6 + x * .05);
  switch (kind){
    case 'drone':
      crystal(g, [[0, 20], [16, 0], [10, -14], [0, -18], [-10, -14], [-16, 0]]);
      g.strokeStyle = rgba(accent, .5); g.beginPath(); g.moveTo(-16, 0); g.lineTo(0, 4); g.lineTo(16, 0); g.moveTo(0, 4); g.lineTo(0, 20); g.stroke();
      glow(g, 0, 2, 14, accent, pulse); ell(g, 0, 2, 4.5, 4.5); g.fillStyle = '#FFFFFF'; g.fill(); break;
    case 'swooper':
      g.rotate(ang);
      crystal(g, [[0, 18], [22, -10], [8, -6], [0, -16], [-8, -6], [-22, -10]]);
      glow(g, 0, -2, 12, accent, pulse); g.fillStyle = '#FFF'; ell(g, 0, -2, 3, 5); g.fill(); break;
    case 'tank':

      crystal(g, [[0, 13], [11, 6], [11, -6], [0, -13], [-11, -6], [-11, 6]], '#2A1C44');
      for (const sx of [-14, 14]){ rr(g, sx - 3, 10, 6, 12, 2); g.fillStyle = '#4E3E70'; g.fill(); }
      glow(g, 0, 0, 16, accent, pulse); ell(g, 0, 0, 5, 5); g.fillStyle = '#FFF'; g.fill(); break;
    case 'sniper':

      glow(g, 0, 24, 10 + 6 * pulse, accent, pulse); glow(g, 0, -2, 8, accent, .8); break;
    case 'spinner':
      g.rotate(t * 2.2);
      for (let i = 0; i < 4; i++){ g.save(); g.rotate(i * TAU / 4); crystal(g, [[0, -4], [6, -20], [0, -24], [-3, -16]]); g.restore(); }
      ell(g, 0, 0, 9, 9); g.fillStyle = NULL_BODY; g.fill(); g.strokeStyle = NULL_EDGE; g.stroke();
      glow(g, 0, 0, 14, accent, pulse); ell(g, 0, 0, 3.5, 3.5); g.fillStyle = '#FFF'; g.fill(); break;
    case 'mine':
      g.rotate(t);
      for (let i = 0; i < 8; i++){ g.save(); g.rotate(i * TAU / 8); poly(g, [[-3, -10], [0, -20], [3, -10]]); g.fillStyle = NULL_EDGE; g.fill(); g.restore(); }

    case 'carrier':

      g.fillStyle = '#120A20'; rr(g, -14, -4, 28, 10, 3); g.fill();

function drawBoss(g, id, x, y, s, t, st = {}){

      ell(g, 0, 10, 26, 8); g.fillStyle = '#081008'; g.fill(); glow(g, 0, 10, 24, col, pulse * .7);
      break; }
    case 'redactor': { // giant tablet with redaction bars and eye
      rr(g, -70, -60, 140, 110, 10); g.fillStyle = '#E9DCC0'; g.fill(); g.strokeStyle = '#5A4A2A'; g.lineWidth = 3; g.stroke();
      for (let i = 0; i < 8; i++){ const yy = -46 + i * 12, w = 60 + ((i * 37) % 50); g.fillStyle = '#B9A784'; g.fillRect(-58, yy, w, 4); }
      for (let i = 0; i < 4; i++){ const yy = -48 + i * 26, sl = Math.sin(t * 1.4 + i) * 30; g.fillStyle = '#0C0812'; g.fillRect(-58 + 30 + sl, yy, 70, 9); }
      ell(g, 0, 70, 30, 16); g.fillStyle = NULL_BODY; g.fill(); g.strokeStyle = NULL_EDGE; g.stroke();

      for (const sx of [-80, 80]){ crystal(g, [[sx, -30], [sx + Math.sign(sx) * 14, -10], [sx, 20], [sx - Math.sign(sx) * 6, -6]]); glow(g, sx, -6, 10, col, .7); }

      for (let i = segs - 1; i >= 0; i--){
        const sx = Math.sin(t * 1.8 - i * .55) * (40 + i * 4), sy = 40 - i * 12 + Math.cos(t * 1.2 - i * .4) * 6, r = 22 - i * 1.2;

      g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-30, -20); g.lineTo(-10, 0); g.lineTo(-22, 20); g.moveTo(24, -24); g.lineTo(8, 4); g.lineTo(26, 26); g.moveTo(0, -30); g.lineTo(2, 40); g.stroke();

/* ---------- backgrounds ---------- */
const STARS = Array.from({ length: 3 }, (_, L) => Array.from({ length: 70 + L * 30 }, (_, i) => ({ x: hash2(i, L, 1), y: hash2(i, L, 2), s: hash2(i, L, 3) })));
const BG_CACHE = {};
function nebulaCanvas(sec){
  if (BG_CACHE[sec.id]) return BG_CACHE[sec.id];
  const c = document.createElement('canvas'); c.width = 540; c.height = 1400; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 1400); gr.addColorStop(0, sec.sky[0]); gr.addColorStop(.5, sec.sky[1]); gr.addColorStop(1, sec.sky[0]); x.fillStyle = gr; x.fillRect(0, 0, 540, 1400);
  const rnd = mulberry32(sec.hue * 97 + 3);
  for (let i = 0; i < 22; i++){
    const px = rnd() * 540, py = rnd() * 1400, r = 80 + rnd() * 220, hue = sec.hue + (rnd() - .5) * 60;
    const ng = x.createRadialGradient(px, py, 0, px, py, r); ng.addColorStop(0, `hsla(${hue},70%,${35 + rnd() * 20}%,${.12 + rnd() * .12})`); ng.addColorStop(1, `hsla(${hue},70%,30%,0)`);
    x.fillStyle = ng; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  // seamless: blend top & bottom
  const top = x.getImageData(0, 0, 540, 120); x.globalAlpha = .5; x.putImageData(top, 0, 1280); x.globalAlpha = 1;
  BG_CACHE[sec.id] = c; return c;
}
function drawSpaceBG(g, W, H, sec, t, scroll){
  const neb = nebulaCanvas(sec), y0 = (scroll * .15) % 1400;
  g.drawImage(neb, 0, y0 - 1400); g.drawImage(neb, 0, y0);
  STARS.forEach((layer, L) => {
    const sp = [0.25, .55, 1][L], sz = [1, 1.4, 2.1][L];
    for (const s of layer){ const yy = (s.y * H + scroll * sp) % H; const tw = .5 + .5 * Math.sin(t * 2 + s.x * 40); g.fillStyle = `rgba(255,255,255,${(.3 + .5 * s.s) * (L === 2 ? tw : 1)})`; g.fillRect(s.x * W, yy, sz, sz); }
  });
  drawProps(g, W, H, sec, t, scroll);
}
function drawProps(g, W, H, sec, t, scroll){

        g.save(); g.translate(x, y); g.rotate(t * (rnd(i, 5) - .5)); g.beginPath(); for (let j = 0; j < 9; j++){ const a = j / 9 * TAU, rr2 = r * (.75 + rnd(i * 9 + j, 6) * .35); j ? g.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2) : g.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } g.closePath();
        g.fillStyle = '#3A2A1E'; g.fill(); g.strokeStyle = '#5A4430'; g.lineWidth = 2; g.stroke(); g.fillStyle = '#2A1E14'; ell(g, r * .2, -r * .2, r * .25, r * .2); g.fill(); g.restore(); }

      for (let i = 0; i < 3; i++){ const x = rnd(i, 7) * W, y = ((rnd(i, 8) * (H + 400)) + scroll * .3) % (H + 400) - 200; g.strokeStyle = 'rgba(124,227,139,.12)'; g.lineWidth = 10; g.beginPath(); g.moveTo(x, y); for (let j = 1; j < 8; j++) g.lineTo(x + Math.sin(t + j) * 30, y + j * 30); g.stroke(); }

/* =========================================================
   Battle engine: vertical shooter with Data Caches, boss locks, reboot
   ========================================================= */
const W = 540, H = 960;
const Battle = {
  on: false, paused: false, B: null,
  start(cfg){
    // cfg: { kind:'battle'|'elite'|'boss', sec, secIdx, depth, mods, weapon, wlv, hull, maxHull, shield, bombs, hooks:{onQuestion, onEnd} }
    const m = cfg.mods;
    const B = this.B = {
      cfg, kind: cfg.kind, sec: cfg.sec, t: 0, scroll: 0, shake: 0, flash: 0,
      p: { x: W / 2, y: H - 170, hp: cfg.hull, max: cfg.maxHull, shield: cfg.shield, inv: 1.2, fireT: 0, droneT: 0, lanceT: 3, lanceOn: 0, swarmT: 1, tilt: 0, rebootUsed: false, phoenix: m.phoenix },
      m, enemies: [], shots: [], eshots: [], pickups: [], fx: [], texts: [], arcs: [], caches: [], boss: null,
      bombs: cfg.bombs, od: 0, odOn: 0, kills: 0, scrap: 0, xpGain: 0, spawnT: 1.2, cachesDone: 0, cacheAt: [], hits: 0,
      diff: 1 + cfg.secIdx * .26 + cfg.depth * .05 + (cfg.kind === 'elite' ? .35 : 0),
      dur: cfg.kind === 'boss' ? 9999 : (cfg.kind === 'elite' ? 95 : 78) + cfg.secIdx * 3,
      ended: false, result: null, banner: null,
    };
    if (B.kind === 'battle') B.cacheAt = [14, 36, 58];
    else if (B.kind === 'elite') B.cacheAt = [14, 34, 54, 74];
    else B.cacheAt = [];
    if (B.kind === 'boss'){
      const bd = BOSSES[cfg.sec.boss];
      const hp = Math.round(bd.hp * (1 + cfg.depth * .02));
      B.boss = { id: cfg.sec.boss, x: W / 2, y: -160, ty: 220, hp, max: hp, t: 0, pat: 0, patT: 2.5, shield: false, locks: cfg.sec.boss === 'heart' ? [.8, .55, .3] : [.66, .33], lockIdx: 0, stun: 0, flash: 0, heads: [1, 1, 1], overclock: 0, minionT: 6 };
      B.banner = { text: bd.name, sub: 'WARNING — NULL GUARDIAN APPROACHING', t: 3 };
      AudioSys.sfx('alarm');
    } else B.banner = { text: cfg.kind === 'elite' ? 'ELITE SQUADRON' : 'MISSION START', sub: cfg.sec.name.toUpperCase(), t: 2.2 };
    this.on = true; this.paused = false;
  },
  stop(){ this.on = false; this.B = null; },

  /* ---------- input ---------- */
  input: { keys: {}, drag: null },
  pointerDown(x, y){ const B = this.B; if (!B) return; this.input.drag = { sx: x, sy: y, px: B.p.x, py: B.p.y }; },
  pointerMove(x, y){ const B = this.B, d = this.input.drag; if (!B || !d) return; B.p.tx = clamp(d.px + (x - d.sx) * 1.25, 24, W - 24); B.p.ty = clamp(d.py + (y - d.sy) * 1.25, 120, H - 60); },
  pointerUp(){ this.input.drag = null; },

  /* ---------- actions ---------- */
  overdrive(){ const B = this.B; if (!B || B.od < 1 || B.odOn > 0) return false; B.od = 0; B.odOn = 6 * (1 + .25 * (B.m.odLv || 0)); AudioSys.sfx('powerup'); B.banner = { text: 'OVERDRIVE!', sub: '', t: 1.2 }; return true; },
  bomb(){
    const B = this.B; if (!B || B.bombs <= 0 || this.paused) return false; B.bombs--;
    AudioSys.sfx('bomb'); B.flash = 1; B.shake = 18;
    for (const s of B.eshots) this.spark(s.x, s.y, '#5CE1FF', 2);
    B.eshots.length = 0;
    for (const e of B.enemies) this.hurt(e, 40 * B.m.dmg);
    if (B.boss && !B.boss.shield && B.boss.y > 0) this.hurtBoss(60 * B.m.dmg);
    return true;
  },

  /* ---------- spawning ---------- */
  spawnEnemy(kind, x, y, o = {}){
    const B = this.B, d = ENEMIES[kind];
    const e = { kind, x, y, hp: d.hp * B.diff, max: d.hp * B.diff, r: d.r, t: 0, fireT: rand(.6, d.fire || 1), flash: 0, vx: 0, vy: d.speed * (o.speedMul || 1), path: o.path || 'down', ph: o.ph || 0, ox: x, stopY: o.stopY ?? rand(140, 360), ang: 0 };
    B.enemies.push(e); return e;
  },
  spawnFormation(){
    const B = this.B, si = B.cfg.secIdx, elite = B.kind === 'elite';
    const options = ['line', 'v', 'sine', 'sine'];
    if (si >= 0) options.push('tank');
    if (si >= 1 || elite) options.push('sniper', 'mines');
    if (si >= 2 || elite) options.push('spinner');
    if (elite && Math.random() < .25) options.push('carrier');
    const f = pick(options);
    switch (f){
      case 'line': { const n = 4 + Math.min(3, si); for (let i = 0; i < n; i++) this.spawnEnemy('drone', 70 + i * (400 / (n - 1)), -30 - (i % 2) * 30); break; }
      case 'v': { const cx = rand(150, 390); for (let i = -2; i <= 2; i++) this.spawnEnemy('swooper', cx + i * 50, -30 - Math.abs(i) * 40, { path: 'dive' }); break; }
      case 'sine': { const left = Math.random() < .5; for (let i = 0; i < 6; i++) this.spawnEnemy('swooper', left ? 120 : 420, -30 - i * 55, { path: 'sine', ph: i * .6 }); break; }
      case 'tank': { const e = this.spawnEnemy('tank', rand(120, 420), -40, { path: 'stop' }); e.stopY = rand(150, 260); this.spawnEnemy('drone', e.x - 70, -80); this.spawnEnemy('drone', e.x + 70, -80); break; }
      case 'sniper': { for (const sx of [rand(60, 200), rand(340, 480)]) this.spawnEnemy('sniper', sx, -30, { path: 'stop' }); break; }
      case 'mines': { for (let i = 0; i < 4; i++) this.spawnEnemy('mine', rand(50, 490), -30 - i * 70, { speedMul: rand(.8, 1.3) }); break; }
      case 'spinner': { const e = this.spawnEnemy('spinner', rand(120, 420), -40, { path: 'stop' }); e.stopY = rand(160, 300); break; }
      case 'carrier': { const e = this.spawnEnemy('carrier', W / 2, -60, { path: 'stop' }); e.stopY = 180; break; }
    }

    hull: 100, sector: 0, loop: 0, map: null, crew: [], shards: 0, codex: [], bonusHints: 0, bonusBombs: 0, nextCards: [], stats: { missions: 0, wins: 0, playMs: 0, sessions: 0, qAsked: 0, qOk: 0 },

    bulletSlow: 1, phoenix: false, magnet: 95, speed: 1, armor: 1 - .07 * SK('d_armor'), scrapMul: .12 * SK('t_scrap') + crewMod('scrap'), odLv: SK('t_od') };

/* ---------------- galaxy map ---------------- */
const NODE_INFO = {
  battle:  { name: 'Patrol Battle', color: '#4FC3F7', desc: 'Clear a wave of Null drones. 2 Data Caches to decrypt.' },
  elite:   { name: 'Elite Squadron', color: '#E070FF', desc: 'Tougher enemies, 3 Data Caches, and better rewards.' },
  station: { name: 'Space Station', color: '#5CE1A0', desc: 'Repair, upgrade weapons, spend skill points, and earn bonus scrap at the Academy Terminal.' },
  anomaly: { name: 'Anomaly', color: '#FFC93A', desc: 'Something strange is out here. A story event with a challenge.' },
  boss:    { name: 'Null Guardian', color: '#FF3D6E', desc: 'The Guardian protects this sector\'s Lumen Shard. Break its encryption locks with your knowledge!' },
};
function genMap(secIdx){
  const rnd = mulberry32(Date.now() % 100000 + secIdx * 31);
  const layout = [1, 2, 3, 2, 2, 1];
  const types = [['battle'], rnd() < .5 ? ['battle', 'anomaly'] : ['anomaly', 'battle'], shuffle(['battle', 'elite', 'anomaly']), rnd() < .5 ? ['station', 'battle'] : ['battle', 'station'], shuffle(['elite', rnd() < .5 ? 'anomaly' : 'battle']), ['boss']];
  const nodes = [];
  layout.forEach((n, d) => { for (let i = 0; i < n; i++) nodes.push({ id: `${d}-${i}`, depth: d, idx: i, type: types[d][i], next: [], x: 270 + (i - (n - 1) / 2) * 160 + (d % 2 ? 14 : -14), y: 840 - d * 128 }); });
  for (const nd of nodes){
    const nextD = nodes.filter(o => o.depth === nd.depth + 1); if (!nextD.length) continue;
    const r = nextD.length / layout[nd.depth];
    const center = (nd.idx + .5) * r - .5;
    nextD.forEach(o => { if (Math.abs(o.idx - center) <= .9 || nextD.length === 1) nd.next.push(o.id); });
    if (!nd.next.length) nd.next.push(nextD[Math.round(clamp(center, 0, nextD.length - 1))].id);
  }
  // make sure each next-depth node has a parent
  for (const o of nodes) if (o.depth > 0 && !nodes.some(n => n.next.includes(o.id))){ const par = nodes.filter(n => n.depth === o.depth - 1); par[Math.min(par.length - 1, o.idx)].next.push(o.id); }
  return { sec: secIdx, nodes, cur: null, cleared: [] };
}
const nodeById = id => P.map.nodes.find(n => n.id === id);
function availableNodes(){ if (!P.map.cur) return P.map.nodes.filter(n => n.depth === 0); return nodeById(P.map.cur).next.map(nodeById); }
let SEL = null;
function drawMap(dt){
  const sec = curSector();
  drawSpaceBG(g, W, H, sec, TT, TT * 12);
  // sector planet & shard
  drawPlanet(g, 400, 150, 70, sec.hue, P.sector % 2 === 0, TT);
  if (P.shards <= P.sector){ glow(g, 400, 150, 40 + 6 * Math.sin(TT * 3), '#5CE1FF', .5); }
  g.fillStyle = '#FFFFFF'; g.font = '900 22px Orbitron, sans-serif'; g.textAlign = 'left'; g.fillText(sec.name.toUpperCase(), 20, 108);
  g.fillStyle = sec.subj === 'mix' ? '#FF3D6E' : SUBJECTS[sec.subj].color; g.font = '700 13px "Exo 2", sans-serif'; g.fillText(`SECTOR ${P.sector + 1}${P.loop ? ` · PATROL LOOP ${P.loop + 1}` : ''} · FOCUS: ${sec.subj === 'mix' ? 'ALL SUBJECTS' : SUBJECTS[sec.subj].name.toUpperCase()}`, 20, 128);
  const avail = availableNodes().map(n => n.id), cleared = new Set(P.map.cleared);
  // edges
  for (const n of P.map.nodes) for (const id of n.next){
    const m = nodeById(id), on = (P.map.cur === n.id && avail.includes(id)) || (!P.map.cur && false), done = cleared.has(n.id) && cleared.has(id);
    g.strokeStyle = done ? 'rgba(92,225,255,.55)' : on ? `rgba(255,201,58,${.6 + .3 * Math.sin(TT * 4)})` : 'rgba(120,140,200,.25)'; g.lineWidth = on ? 3 : 2;
    g.setLineDash(done || on ? [] : [6, 8]); g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(m.x, m.y); g.stroke(); g.setLineDash([]);
  }

  for (const n of P.map.nodes){
    const info = NODE_INFO[n.type], isA = avail.includes(n.id), isC = cleared.has(n.id), sel = SEL === n.id;
    const r = n.type === 'boss' ? 38 : 28;

    ell(g, n.x, n.y, r, r); g.fillStyle = isC ? '#141C3A' : '#0E1530'; g.fill(); g.lineWidth = sel ? 4 : 2.5; g.strokeStyle = isC ? '#3A4A80' : isA ? info.color : rgba(info.color, .45); g.stroke();
    drawNodeIcon(n.type, n.x, n.y, r, isC ? '#4A5A80' : info.color);
    if (isC){ g.strokeStyle = '#5CE1A0'; g.lineWidth = 3; g.beginPath(); g.moveTo(n.x + r * .45, n.y + r * .55); g.lineTo(n.x + r * .65, n.y + r * .78); g.lineTo(n.x + r * 1.0, n.y + r * .3); g.stroke(); }
  }
  // the Comet on the current node
  const at = P.map.cur ? nodeById(P.map.cur) : { x: 270, y: 930 };
  drawShip(g, at.x, at.y + (P.map.cur ? 0 : 0) - 4 + Math.sin(TT * 2) * 4, 34, TT, { weapon: P.weapon });

function drawNodeIcon(type, x, y, r, c){

/* ---------------- dialogue ---------------- */
let DLG = null;
function say(lines, opts = {}){
  return new Promise(res => {
    if (TIME.fast || !lines || !lines.length){ res(); return; }
    let i = 0; const box = $('dlg');
    const showLine = () => {
      const [who, text, mood] = lines[i]; const C = CHARS[who] || CHARS.narr;
      box.classList.toggle('narr', who === 'narr');
      $('dlgName').textContent = C.name; $('dlgName').style.color = C.color;
      DLG = { who, mood: mood || (who === 'hajun' ? 'determined' : 'neutral'), text, shown: 0, t0: performance.now() };
      $('dlgText').textContent = '';
    };
    const next = () => {
      if (DLG && DLG.shown < DLG.text.length){ DLG.shown = DLG.text.length; $('dlgText').textContent = DLG.text; return; }
      i++; if (i >= lines.length){ box.hidden = true; box.onclick = null; DLG = null; res(); } else { showLine(); AudioSys.sfx('tap'); }
    };
    box.hidden = false; box.onclick = e => { if (e.target.id === 'dlgSkip') return; next(); };
    $('dlgSkip').onclick = e => { e.stopPropagation(); box.hidden = true; DLG = null; res(); };
    showLine();
  });
}

/* ---------------- questions ---------------- */
let QS = null;
let FREEPOOL = 1;
function hintsLeft(){ return MISSION ? MISSION.hints : FREEPOOL; }
function ask(kind, opts = {}){
  return new Promise(res => {
    const sec = curSector();
    const Q = opts.Q || Learn.next({ focus: sec.subj === 'mix' ? null : sec.subj, harder: kind === 'lock' && P.sector >= 3, noReview: kind === 'reboot' });
    QS = { Q, kind, res, t0: performance.now(), answered: false, hinted: false, limit: (20 + Q.q.length / 14 + 6 * SK('s_focus')) * 1000 };
    const S = SUBJECTS[Q.subj];
    $('qSubj').textContent = S.name.toUpperCase(); $('qSubj').style.background = S.color;
    $('qTopic').textContent = Q.topic + (Q.review ? ' · REVIEW' : '');
    $('qDiff').innerHTML = [1, 2, 3, 4, 5].map(i => `<i class="${i <= Q.d ? 'on' : ''}"></i>`).join('');
    const who = { cache: 'DATA CACHE — decrypt it to unlock a power-up!', lock: 'ENCRYPTION LOCK — answer to break the Guardian\'s shield!', reboot: 'EMERGENCY REBOOT — answer correctly to restore power!', academy: 'ACADEMY TERMINAL — bonus scrap for correct answers', event: opts.title || 'ANOMALY CHALLENGE' }[kind];
    $('qWho').textContent = who;
    $('qTextIn').textContent = Q.q;
    const box = $('qChoices'); box.innerHTML = '';
    Q.choices.forEach((c, i) => { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = `<span class="key">${'ABCD'[i]}</span><span>${esc(c)}</span>`; b.dataset.v = c; b.onclick = () => answer(c, b); box.appendChild(b); });
    show('qFeed', false); show('qNext', false); show('qHint', true); show('qTimer', true); show('qTimerLbl', true);
    const crew = MISSION ? P.crew.find(c => CREW[c].subj === Q.subj && !MISSION.crewHintUsed[c]) : null;
    $('qHint').textContent = crew ? `Ask ${{ kai: 'Kai', mira: 'Mira', lexi: 'LEXI', ellis: 'Ellis', zara: 'Zara', kofi: 'Kofi' }[crew]} (free)` : `Hint (${hintsLeft()})`;
    $('qHint').dataset.crew = crew || '';
    $('qHint').disabled = !crew && hintsLeft() <= 0;
    show('q', true); AudioSys.duck(true); AudioSys.sfx(kind === 'lock' ? 'lock' : 'cache');
    if (Voice.on) setTimeout(() => Voice.say(Q.q), 300);
  });
}
function useHint(){
  if (!QS || QS.answered || QS.hinted) return;
  const crew = $('qHint').dataset.crew;
  if (crew){ if (MISSION) MISSION.crewHintUsed[crew] = true; }
  else { if (hintsLeft() <= 0) return; if (MISSION) MISSION.hints--; else FREEPOOL--; }
  QS.hinted = true; AudioSys.sfx('chime');
  const wrong = [...$('qChoices').children].filter(b => b.dataset.v !== QS.Q.answer);
  shuffle(wrong).slice(0, Math.max(0, wrong.length - 1)).forEach(b => b.classList.add('gone'));
  $('qHint').disabled = true;
  if (crew) toast(`<b style="color:${CHARS[crew].color}">${CREW[crew].name}:</b> "I can rule out ${wrong.length - 1 === 1 ? 'one answer' : 'a couple of answers'} for you!"`);
}
function answer(choice, btn){
  const S = QS; if (!S || S.answered) return;
  S.answered = true; Voice.stop();
  const ms = performance.now() - S.t0, ok = choice === S.Q.answer, quick = ms <= S.limit;
  [...$('qChoices').children].forEach(b => { b.disabled = true; if (b.dataset.v === S.Q.answer) b.classList.add('ok'); });
  if (!ok) btn.classList.add('no');
  const r = Learn.record(S.Q, ok, ms, S.hinted);
  P.stats.qAsked++; if (ok){ P.stats.qOk++; if (P.stats.qOk % 10 === 0) setTimeout(unlockCodex, 600); }
  if (SESSION){ SESSION.qAsked++; if (ok) SESSION.qOk++; }
  if (MISSION){ MISSION.qAsked++; if (ok) MISSION.qOk++; }
  // rewards text
  const xpBase = (ok ? 20 + 12 * S.Q.d : 6) * (1 + .1 * SK('s_wis')) * (ok && quick && !S.hinted ? 1.5 : 1) * (S.hinted ? .5 : 1) * (r.redemption ? 1.5 : 1);
  const scrapG = ok ? 5 * S.Q.d : 2;
  S.xp = Math.round(xpBase); S.scrap = scrapG;
  if (MISSION){ MISSION.qxp += S.xp; MISSION.qscrap += S.scrap; } else { gainXP(S.xp); P.scrap += S.scrap; }
  const fb = $('qFeed'); fb.className = ok ? 'good' : 'bad';
  const head = ok ? (r.redemption ? 'REDEMPTION! You got it this time.' : pick(NOVA_PRAISE)) : pick(NOVA_ENCOURAGE);
  const tags = [];
  if (ok && quick && !S.hinted) tags.push('QUICK BONUS ×1.5');
  if (ok && r.hard) tags.push('CHALLENGE QUESTION');
  if (ok && r.streak >= 3) tags.push(`STREAK ×${r.streak}`);
  fb.innerHTML = `<b>${esc(head)}</b>${ok ? '' : `<div style="margin-top:4px">Answer: <b style="color:#5CE1A0">${esc(S.Q.answer)}</b></div>`}<div style="margin-top:6px">${esc(S.Q.e)}</div><div class="rw">+${S.xp} XP · +${S.scrap} scrap${tags.length ? ' · ' + tags.join(' · ') : ''}</div>`;
  show('qFeed', true); show('qHint', false); show('qTimer', false); show('qTimerLbl', false); show('qNext', true);
  AudioSys.sfx(ok ? 'correct' : 'wrong');
  Clips.play(ok ? 'ok' : 'no');
  if (ok && r.streak >= 3 && r.streak % 1 === 0) setTimeout(() => AudioSys.sfx('streak'), 300);
  S.result = { ok, r, hinted: S.hinted, quick };
  if (TIME.fast) setTimeout(closeQuestion, 0);
}
function closeQuestion(){
  const S = QS; if (!S || !S.answered) return;
  QS = null; show('q', false); AudioSys.duck(false); AudioSys.sfx('confirm');
  S.res(S.result);
}
function tickQuestion(){
  if (!QS || QS.answered) return;
  const left = Math.max(0, QS.limit - (performance.now() - QS.t0));
  $('qTimerN').textContent = Math.ceil(left / 1000);
  $('qTimerArc').style.strokeDashoffset = String(100.5 * (1 - left / QS.limit));
  $('qTimerArc').style.stroke = left > 0 ? '#FFC93A' : '#3A4A80';
}

/* ---------------- power-up cards ---------------- */
function rollCards(n, w){
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 50){
    let x = Math.random() * (w[0] + w[1] + w[2]), tier = x < w[0] ? 0 : x < w[0] + w[1] ? 1 : 2;
    const pool = CARDS.filter(c => c.tier === tier && !out.includes(c) && !(c.id === 'phoenix' && MISSION && MISSION.m.phoenix));
    if (pool.length) out.push(pick(pool));
  }
  return out;
}
function cardArt(c, id, tier){
  const x = c.getContext('2d'), col = TIER_COLOR[tier]; x.clearRect(0, 0, 168, 168); x.save(); x.scale(2, 2);
  glow(x, 42, 42, 40, col, .5);
  x.translate(42, 42); x.strokeStyle = '#FFFFFF'; x.fillStyle = col; x.lineWidth = 3; x.lineCap = 'round';
  const ic = {
    rapid: () => { for (let i = -1; i <= 1; i++){ x.beginPath(); x.moveTo(i * 10, 14); x.lineTo(i * 10, -14); x.stroke(); } },
    power: () => { poly(x, [[4, -18], [-10, 4], [0, 4], [-4, 18], [10, -4], [0, -4]]); x.fill(); x.stroke(); },
    patch: () => { x.fillRect(-14, -5, 28, 10); x.fillRect(-5, -14, 10, 28); },
    magnet: () => { x.beginPath(); x.arc(0, 0, 14, Math.PI, 0); x.stroke(); x.fillRect(-17, 0, 7, 10); x.fillRect(10, 0, 7, 10); },
    thrust: () => { poly(x, [[0, -16], [10, 8], [-10, 8]]); x.fill(); glow(x, 0, 14, 10, '#FF8A3C', 1); },
    shield1: () => { poly(x, [[0, -16], [14, -8], [12, 8], [0, 16], [-12, 8], [-14, -8]]); x.stroke(); },
    twin: () => { for (const s of [-7, 7]){ x.beginPath(); x.moveTo(s, 14); x.lineTo(s, -16); x.stroke(); } },
    orb: () => { x.beginPath(); x.arc(0, 0, 14, 0, TAU); x.stroke(); ell(x, 14, 0, 5, 5); x.fill(); },
    drone: () => { poly(x, [[0, -10], [12, 8], [-12, 8]]); x.fill(); poly(x, [[-16, -2], [-10, 8], [-22, 8]]); x.fill(); },
    rear: () => { for (const a of [Math.PI / 2, Math.PI * .2, Math.PI * .8]){ x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a) * 16, Math.sin(a) * 16); x.stroke(); } },
    crit: () => { x.beginPath(); x.arc(0, 0, 12, 0, TAU); x.stroke(); x.beginPath(); x.moveTo(-18, 0); x.lineTo(18, 0); x.moveTo(0, -18); x.lineTo(0, 18); x.stroke(); },
    regen: () => { x.beginPath(); x.arc(0, 0, 13, .5, TAU - .5); x.stroke(); x.fillRect(-3, -9, 6, 18); x.fillRect(-9, -3, 18, 6); },
    lance: () => { x.fillRect(-5, -20, 10, 40); },
    slow: () => { x.beginPath(); x.arc(0, 0, 14, 0, TAU); x.stroke(); x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -9); x.moveTo(0, 0); x.lineTo(7, 3); x.stroke(); },
    over: () => { poly(x, [[4, -18], [-10, 4], [0, 4], [-4, 18], [10, -4], [0, -4]]); x.fill(); x.beginPath(); x.arc(0, 0, 18, 0, TAU); x.stroke(); },
    phoenix: () => { poly(x, [[0, -16], [16, 6], [6, 2], [0, 16], [-6, 2], [-16, 6]]); x.fill(); },
    swarm: () => { for (let i = -1; i <= 1; i++){ poly(x, [[i * 10, -12], [i * 10 + 4, 4], [i * 10 - 4, 4]]); x.fill(); } },
  }[id];
  ic && ic(); x.restore();
}
function chooseCard(cards, title, sub){
  return new Promise(res => {
    if (!cards.length){ res(null); return; }
    $('cardsH').textContent = title; $('cardsSub').textContent = sub || '';
    const row = $('cardRow'); row.innerHTML = ''; row.style.gridTemplateColumns = `repeat(${cards.length},1fr)`;
    cards.forEach((c, i) => {
      const d = document.createElement('button'); d.className = 'pcard'; d.style.setProperty('--tc', TIER_COLOR[c.tier]); d.style.animationDelay = (i * .08) + 's';
      d.innerHTML = `<span class="tier">${TIER_NAME[c.tier].toUpperCase()}</span><canvas width="168" height="168"></canvas><span class="nm">${c.name}</span><span class="ds">${c.desc}</span>`;
      cardArt(d.querySelector('canvas'), c.id, c.tier);
      d.onclick = () => { show('cards', false); AudioSys.sfx('powerup'); res(c); };
      row.appendChild(d);
    });
    show('cards', true); AudioSys.sfx('unlock');

}
const BATTLE_API = { heal(f){ const p = Battle.B && Battle.B.p; if (p) p.hp = Math.min(p.max, p.hp + p.max * f); }, addShield(n){ const p = Battle.B && Battle.B.p; if (p) p.shield += n; } };
function applyCard(c){ if (!c || !Battle.B) return; c.apply(Battle.B.m, BATTLE_API); MISSION.cards.push(c.id); Battle.text && Battle.text(Battle.B.p.x, Battle.B.p.y - 50, c.name.toUpperCase(), TIER_COLOR[c.tier]); }

/* ---------------- missions ---------------- */
async function launchNode(n){
  show('nodeInfo', false); SEL = null;
  if (n.type === 'station') return runStation(n);
  if (n.type === 'anomaly') return runAnomaly(n);
  return runBattle(n);
}
async function runBattle(n){
  const sec = curSector();
  if (n.type === 'boss') await say(sec.preBoss);
  SCENE = 'battle'; show('mapHud', false); show('mapBar', false); show('bBtns', true);
  const mods = computeMods();
  const mh = maxHull(); P.hull = clamp(P.hull, mh * .4, mh);
  MISSION = { node: n, m: mods, hints: 2 + SK('s_hint') + crewMod('hints') + (P.bonusHints || 0), crewHintUsed: {}, qAsked: 0, qOk: 0, qxp: 0, qscrap: 0, cards: [], startStreak: P.learn.streak };
  P.bonusHints = 0;
  const bombs = 1 + SK('t_bomb') + (P.bonusBombs || 0); P.bonusBombs = 0;
  AudioSys.play(n.type === 'boss' ? (sec.id === 'core' ? 'final' : 'boss') : sec.music);
  Battle.start({ kind: n.type, sec, secIdx: P.sector + P.loop * 3, depth: n.depth + P.loop * 4, mods, weapon: P.weapon, wlv: P.weapons[P.weapon] || 1, hull: P.hull, maxHull: mh, shield: SK('d_shield') + crewMod('shield'), bombs,
    hooks: { onQuestion: battleQuestion, onEnd: r => endBattle(n, r) } });
  if (P.nextCards && P.nextCards.length){
    Battle.paused = true;
    for (const tier of P.nextCards.splice(0)){ const c = await chooseCard(rollCards(3, tier === 2 ? [0, 0, 1] : [0, 1, 0]), tier === 2 ? 'EPIC BONUS' : 'RARE BONUS', 'A gift from your last anomaly.'); applyCard(c); }
    Battle.paused = false;
  }
}
async function battleQuestion(kind, opts){
  Battle.paused = true;
  if (kind === 'lock'){
    let ok = 0; const n = opts.count || 1;
    for (let i = 0; i < n; i++){ const r = await ask('lock'); if (r.ok) ok++; }
    Battle.paused = false;
    return { ok: ok >= Math.ceil(n / 2) };
  }
  const r = await ask(kind);
  if (kind === 'cache'){
    const st = r.r.streak;
    if (r.ok){
      let w = r.r.hard ? [30, 50, 20] : [58, 34, 8];
      if (st >= 3) w = [w[0] - 8, w[1], w[2] + 8];
      if (r.r.redemption) w = [0, 70, 30];
      if (r.hinted) w = [70, 30, 0];
      const c = await chooseCard(rollCards(r.hinted ? 2 : 3, w), r.r.redemption ? 'REDEMPTION REWARD' : 'CHOOSE A POWER-UP', r.hinted ? 'Hint used: 2 cards to choose from.' : r.r.hard ? 'Challenge question: better odds for Rare and Epic cards!' : 'Correct answers let you choose your reward.');
      applyCard(c);
      if (st > 0 && st % 3 === 0 && Battle.B){ Battle.B.od = 1; toast('<b style="color:#FFC93A">STREAK ×' + st + '</b> — Overdrive fully charged! Tap the lightning button.'); }
      if (st > 0 && st % 5 === 0) unlockCodex();
    } else {
      const c = rollCards(1, [1, 0, 0])[0];
      await chooseCard([c], 'CONSOLATION', 'Wrong answers still earn a small boost. This question will come back later for a Redemption bonus!');
      applyCard(c);
    }
  }
  Battle.paused = false;
  return { ok: r.ok };
}
function unlockCodex(){
  const locked = CODEX.map((c, i) => i).filter(i => !P.codex.includes(i));
  if (!locked.length) return null;
  const sec = curSector(); const pref = locked.filter(i => CODEX[i][0] === sec.subj);
  const i = pick(pref.length ? pref : locked); P.codex.push(i);
  toast(`<b style="color:#5CE1FF">CODEX ENTRY UNLOCKED</b><br>${CODEX[i][1]}`, 3200); AudioSys.sfx('unlock');
  return i;
}
async function endBattle(n, r){
  show('bBtns', false);
  const M = MISSION, sec = curSector();
  P.stats.missions++; if (r.win) P.stats.wins++;
  const scrapMul = 1;
  let scrap = Math.round(r.scrap * scrapMul) + M.qscrap;
  let xp = r.xp + M.qxp + (r.win ? 40 + P.sector * 10 : 0);
  if (!r.win) scrap = Math.round(scrap * .5);
  const rested = P.rested > 0; if (rested){ xp = Math.round(xp * 1.5); P.rested = 0; }
  P.scrap += scrap;
  const lv0 = P.level, gx = gainXP(xp);
  if (r.win){ P.hull = Math.max(r.hull, maxHull() * .4); P.map.cleared.push(n.id); P.map.cur = n.id; if (n.type === 'boss'){ unlockCodex(); unlockCodex(); } else if (n.type === 'elite') unlockCodex(); } else P.hull = maxHull() * .6;
  if (SESSION) SESSION.missions++;
  saveGame();
  AudioSys.play(r.win ? 'victory' : 'defeat', () => AudioSys.play('map'));
  if (r.win) Clips.play('win', { force: true });
  await showResults(r, { scrap, xp: gx.x, ups: gx.ups, lv0, rested, boss: n.type === 'boss' });
  Battle.stop(); MISSION = null;
  if (r.win && n.type === 'boss') await completeSector();
  else await backToMap();
}

      let body = '';

        body = `<div class="box"><div class="k">Hull</div><div class="v">${Math.round(P.hull)}/${mh}</div><div class="bar" style="margin-top:8px"><i style="width:${P.hull / mh * 100}%;background:#5CE1A0"></i></div></div>
          <div class="item"><div style="flex:1"><div class="nm">Station Repair Crew</div><div class="ds">Free patch: restores 50% hull.</div></div><button class="btn small" data-act="free" ${ST.freeRepair && P.hull < mh ? '' : 'disabled'}>Free</button></div>
          <div class="item"><div style="flex:1"><div class="nm">Full Overhaul</div><div class="ds">Restore hull to 100%.</div></div><button class="btn small orange" data-act="full" ${P.scrap >= cost(30) && P.hull < mh ? '' : 'disabled'}>${cost(30)} scrap</button></div>
          <div class="item"><div style="flex:1"><div class="nm">Hint Module</div><div class="ds">+1 hint charge for your next mission. (Bonus: ${P.bonusHints})</div></div><button class="btn small orange" data-act="hint" ${P.scrap >= cost(25) ? '' : 'disabled'}>${cost(25)} scrap</button></div>
          <div class="item"><div style="flex:1"><div class="nm">Nova Burst Charge</div><div class="ds">+1 screen-clearing bomb for your next mission. (Bonus: ${P.bonusBombs})</div></div><button class="btn small orange" data-act="bomb" ${P.scrap >= cost(40) ? '' : 'disabled'}>${cost(40)} scrap</button></div>`;
      } else if (ST.tab === 'armory'){
        body = Object.entries(WEAPONS).map(([id, w]) => {
          const lv = P.weapons[id], owned = !!lv, eq = P.weapon === id;
          const btn = !owned ? `<button class="btn small orange" data-buy="${id}" ${P.scrap >= cost(w.cost) ? '' : 'disabled'}>Buy ${cost(w.cost)}</button>`
            : `${lv < 5 ? `<button class="btn small orange" data-up="${id}" ${P.scrap >= cost(WEAPON_UPGRADE_COST(lv)) ? '' : 'disabled'}>Lv${lv + 1}: ${cost(WEAPON_UPGRADE_COST(lv))}</button>` : '<span class="lv">MAX</span>'} ${eq ? '<span class="chip" style="background:#5CE1A0">EQUIPPED</span>' : `<button class="btn small" data-eq="${id}">Equip</button>`}`;
          return `<div class="item"><div style="width:10px;height:44px;border-radius:5px;background:${w.color}"></div><div style="flex:1"><div class="nm">${w.name} ${owned ? `<span class="lv">LV ${lv}</span>` : ''}</div><div class="ds">${w.desc}</div></div><div class="row" style="justify-content:flex-end;max-width:180px">${btn}</div></div>`;
        }).join('');
      } else if (ST.tab === 'skills'){ body = skillTreeHTML(); }
      else if (ST.tab === 'academy'){
        body = ST.academy ? `<div class="sub">You already used this terminal. Come back at the next station!</div>` : `<div class="sub">Answer 3 questions. Each correct answer earns <b style="color:#FFC93A">25 scrap</b> and XP. Quick and correct answers earn more XP.</div><button class="btn orange" data-act="academy" style="width:100%">Start Academy Drill</button>`;
      }
      $('panelBody').innerHTML = `<div class="row"><h2>SPACE STATION</h2><span class="chip right" style="background:#FFC93A">${P.scrap} SCRAP</span></div><div class="sub">${zaraLine()}</div><div class="tabRow">${tabs}</div>${body}<div class="row" style="margin-top:14px"><button class="btn orange right" data-auto="1" id="stLeave">Undock</button></div>`;
      $('panelBody').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { ST.tab = b.dataset.tab; AudioSys.sfx('tap'); render(); });
      $('panelBody').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
        const a = b.dataset.act;
        if (a === 'free'){ P.hull = Math.min(mh, P.hull + mh * .5); ST.freeRepair = false; AudioSys.sfx('heal'); }
        if (a === 'full'){ P.scrap -= cost(30); P.hull = mh; AudioSys.sfx('heal'); }
        if (a === 'hint'){ P.scrap -= cost(25); P.bonusHints++; AudioSys.sfx('coin'); }
        if (a === 'bomb'){ P.scrap -= cost(40); P.bonusBombs++; AudioSys.sfx('coin'); }
        if (a === 'academy'){ ST.academy = true; show('panel', false); let ok = 0; for (let i = 0; i < 3; i++){ const r = await ask('academy'); if (r.ok){ ok++; P.scrap += 25; } } toast(`Academy drill: <b>${ok}/3</b> correct · +${ok * 25} scrap`); if (ok === 3) unlockCodex(); show('panel', true); }
        updateHUD(); saveGame(); render();
      });
      $('panelBody').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const id = b.dataset.buy; P.scrap -= cost(WEAPONS[id].cost); P.weapons[id] = 1; P.weapon = id; AudioSys.sfx('unlock'); saveGame(); updateHUD(); render(); });
      $('panelBody').querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const id = b.dataset.up; P.scrap -= cost(WEAPON_UPGRADE_COST(P.weapons[id])); P.weapons[id]++; AudioSys.sfx('powerup'); saveGame(); updateHUD(); render(); });
      $('panelBody').querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { P.weapon = b.dataset.eq; AudioSys.sfx('select'); saveGame(); render(); });
      bindSkillButtons(render);
      $('stLeave').onclick = async () => { show('panel', false); AudioSys.sfx('confirm'); P.map.cleared.push(n.id); P.map.cur = n.id; saveGame(); await backToMap(); res(); };
    };
    render(); show('panel', true);
  });
}
function zaraLine(){
