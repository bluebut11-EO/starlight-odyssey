}
function bindSkillButtons(rerender){ $('panelBody').querySelectorAll('[data-skill]').forEach(b => b.onclick = () => { const id = b.dataset.skill; if (P.sp <= 0 || SK(id) >= 3) return; P.sp--; P.skills[id] = SK(id) + 1; if (id === 'd_hull') P.hull += 15; AudioSys.sfx('levelup'); saveGame(); updateHUD(); rerender(); }); }

/* ---------------- anomalies ---------------- */
function runAnomaly(n){
  return new Promise(res => {
    AudioSys.play('event');
    const A = pick(ANOMALIES); FREEPOOL = 1;
    $('panelBody').innerHTML = `<div class="row"><h2 style="color:#FFC93A">${A.title.toUpperCase()}</h2></div><canvas id="anoArt" width="944" height="320" style="width:100%;height:160px;border-radius:16px;margin:6px 0 10px"></canvas><div class="sub" style="font-family:Lexend;color:#C9D6FF;font-size:17px">${A.text}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost small" id="anoSkip">Move on</button><button class="btn orange right" data-auto="1" id="anoGo">${A.ask}</button></div>`;
    const art = $('anoArt').getContext('2d'); art.scale(2, 2); drawSpaceBG(art, 472, 160, curSector(), TT, 0); drawPlanet(art, 360, 80, 46, curSector().hue + 40, true, 0); drawPortrait(art, 'nova', 70, 84, 120, TT, 'neutral');
    if (A.id === 'freighter' || A.id === 'archive') drawEnemy(art, 'carrier', 230, 80, 40, 0, '#FFC93A', 0);
    if (A.id === 'rift') { glow(art, 240, 80, 60, '#FF3D6E', .8); }
    show('panel', true);
    const done = async () => { P.map.cleared.push(n.id); P.map.cur = n.id; saveGame(); await backToMap(); res(); };
    $('anoSkip').onclick = () => { show('panel', false); AudioSys.sfx('cancel'); done(); };
    $('anoGo').onclick = async () => {
      show('panel', false);
      const r = await ask('event', { title: A.title.toUpperCase() });
      const rw = r.ok ? A.reward.good : A.reward.bad, lines = [];
      if (rw.scrap){ P.scrap += rw.scrap; lines.push(`+${rw.scrap} scrap`); }
      if (rw.xp){ const gx = gainXP(rw.xp); lines.push(`+${gx.x} XP${gx.ups ? ' · LEVEL UP!' : ''}`); }
      if (rw.hints){ P.bonusHints += rw.hints; lines.push(`+${rw.hints} hint charges next mission`); }
      if (rw.codex){ const i = unlockCodex(); if (i != null) lines.push(`Codex: ${CODEX[i][1]}`); }
      if (rw.epic){ P.nextCards.push(2); lines.push('Epic card next mission'); }
      if (rw.rare){ P.nextCards.push(1); lines.push('Rare card next mission'); }
      if (rw.common){ P.scrap += 15; lines.push('+15 scrap'); }
      if (rw.heal){ P.hull = Math.min(maxHull(), P.hull + maxHull() * rw.heal); lines.push(rw.heal >= 1 ? 'Hull fully repaired' : 'Hull partly repaired'); }
      if (rw.damage){ P.hull = Math.max(maxHull() * .4, P.hull - maxHull() * rw.damage); lines.push('Hull damaged'); }
      await infoPanel(r.ok ? 'SUCCESS' : 'PARTIAL SUCCESS', `<div class="sub" style="font-family:Lexend;font-size:17px;color:#C9D6FF">${r.ok ? A.good : A.bad}</div><div class="box"><div class="k">Rewards</div><div style="margin-top:6px;font-weight:800;color:#FFC93A;line-height:1.6">${lines.join('<br>')}</div></div>`);
      updateHUD(); done();
    };
  });
}

/* ---------------- sessions (shift timer, rested bonus, daily drop) ---------------- */
function startSession(){
  SESSION = { start: Date.now(), activeMs: 0, missions: 0, qAsked: 0, qOk: 0, xp: 0, warned: false, overtime: false, lv0: P.level };
  P.stats.sessions++;
  if (P.lastEnd && Date.now() - P.lastEnd >= 60 * 60 * 1000) P.rested = 1;
}
async function dailyDrop(){
  const d = today(); if (P.daily.last === d) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  P.daily.streak = P.daily.last === y ? P.daily.streak + 1 : 1; P.daily.last = d;
  const scrap = 40 + 10 * Math.min(5, P.daily.streak - 1); P.scrap += scrap; P.bonusHints += 1; saveGame();
  await infoPanel('DAILY SUPPLY DROP', `<div class="sub">Commander Okafor sent supplies for today's shift.</div><div class="grid2"><div class="box"><div class="k">Scrap</div><div class="v" style="color:#FFC93A">+${scrap}</div></div><div class="box"><div class="k">Hint charge</div><div class="v" style="color:#5CE1FF">+1</div></div></div><div class="sub" style="margin-top:12px">Daily streak: <b style="color:#FF9E40">${P.daily.streak} day${P.daily.streak > 1 ? 's' : ''}</b>. Come back tomorrow for a bigger drop!</div>${P.rested ? '<div class="box" style="margin-top:10px;box-shadow:0 0 0 2px #5CE1A0 inset"><div class="k" style="color:#5CE1A0">Rested bonus active</div><div style="margin-top:4px">Your first mission this shift earns ×1.5 XP.</div></div>' : ''}`);
}
function nextTeaser(){
  const sec = curSector(), av = P.map ? availableNodes() : [];
  if (av.some(n => n.type === 'boss')) return `The <b>${BOSSES[sec.boss].name}</b> is waiting at the end of ${sec.name}. Can you break its encryption?`;
  const nxt = SECTORS[P.sector + 1];
  return `${sec.name} still hides Null squadrons — and ${nxt ? `beyond it lies <b>${nxt.name}</b>` : 'the Null Core is close'}…`;
}
async function checkShift(){
  if (!SESSION || SCENE !== 'map') return;
  const lim = P.shiftMin * 60000;
  if (!SESSION.overtime && SESSION.activeMs >= lim) return shiftComplete();
  if (SESSION.overtime && SESSION.overtimeMissions !== undefined && SESSION.missions > SESSION.overtimeMissions) return shiftComplete();
}
function shiftComplete(){
  return new Promise(res => {
    AudioSys.play('story');
    const acc = SESSION.qAsked ? Math.round(SESSION.qOk / SESSION.qAsked * 100) : 0;
    $('panelBody').innerHTML = `<h2>SHIFT COMPLETE</h2><div class="sub">Great work today, Cadet. NOVA saved your progress.</div>
      <div class="grid2"><div class="box"><div class="k">Time</div><div class="v">${fmtTime(SESSION.activeMs)}</div></div><div class="box"><div class="k">Missions</div><div class="v">${SESSION.missions}</div></div>
      <div class="box"><div class="k">Questions</div><div class="v">${SESSION.qOk}/${SESSION.qAsked} <span style="font-size:13px;color:#9FB3D9">${acc}%</span></div></div><div class="box"><div class="k">Level</div><div class="v">${SESSION.lv0} → ${P.level}</div></div></div>
      <div class="box" style="margin-top:12px"><div class="k">Next time on Starlight Odyssey</div><div style="margin-top:6px;font-family:Lexend;line-height:1.5">${nextTeaser()}</div></div>
      <div class="box" style="margin-top:10px;box-shadow:0 0 0 2px #5CE1A0 inset"><div class="k" style="color:#5CE1A0">Rested bonus</div><div style="margin-top:4px">Take a break for at least an hour, and your first mission next time earns <b>×1.5 XP</b>. Tomorrow's Daily Supply Drop will be waiting too.</div></div>
      <div class="row" style="margin-top:16px"><button class="btn ghost small" id="shMore">One more mission</button><button class="btn orange right" data-auto="1" id="shEnd">Save &amp; End Shift</button></div>`;
    show('panel', true); AudioSys.sfx('chime');
    $('shEnd').onclick = () => { show('panel', false); P.lastEnd = Date.now(); saveGame(); SESSION = null; goTitle(true); res(); };
    $('shMore').onclick = () => { show('panel', false); SESSION.overtime = true; SESSION.overtimeMissions = SESSION.missions; toast('Overtime! NOVA will remind you after the next mission.'); AudioSys.play('map'); res(); };
  });
}

/* ---------------- HUD & panels ---------------- */
function updateHUD(){
  if (!P) return;
  $('hudLvN').textContent = P.level; $('hudRank').textContent = ['CADET', 'ENSIGN', 'LIEUTENANT', 'COMMANDER', 'CAPTAIN', 'ADMIRAL'][Math.min(5, Math.floor((P.level - 1) / 5))];
  $('hudXp').style.width = (P.xp / xpNeed(P.level) * 100) + '%';
  $('hudScrap').querySelector('b').textContent = P.scrap;
  $('hudShard').querySelector('b').textContent = `${Math.min(7, P.shards)}/7`;
  if (SESSION){ const left = P.shiftMin * 60000 - SESSION.activeMs; $('hudShiftT').textContent = left >= 0 ? fmtTime(left) : '+' + fmtTime(-left); $('hudShift').classList.toggle('warn', left < P.shiftMin * 60000 * .2); }
}

function reportPanel(p = P){

    <div class="days">${days.map(x => `<div><span>${x.q}</span><i style="height:${Math.round(x.q / maxQ * 60)}px"></i><span>${x.d.slice(5)}</span></div>`).join('')}</div>
    ${weak.length ? `<div style="margin-top:14px;font-weight:800">Topics to practice</div>${weak.map(w => `<div class="item" style="padding:8px 12px"><div style="flex:1"><span style="color:${SUBJECTS[w.subj].color};font-weight:800">${SUBJECTS[w.subj].name}</span> · ${esc(w.topic)}</div><span class="lv">${Math.round(w.acc * 100)}% of ${w.att}</span></div>`).join('')}` : ''}
    <div style="margin-top:14px;font-weight:800">Review queue: ${L.review.length} question${L.review.length === 1 ? '' : 's'} waiting · Best streak: ${L.bestStreak}</div>
    ${L.mistakes.length ? `<div style="margin-top:12px;font-weight:800">Recent mistakes</div>${L.mistakes.slice(0, 8).map(m => `<div class="mist"><span style="color:${SUBJECTS[m.subj].color};font-weight:700">${SUBJECTS[m.subj].name} · ${esc(m.topic)}</span><br>${esc(m.q)}<br><b style="color:#5CE1A0">${esc(m.a)}</b> — <span style="color:#9FB3D9">${esc(m.e)}</span></div>`).join('')}` : ''}
    <div class="sub" style="margin-top:10px">Standards: ${SUBJ_KEYS.map(s => `${SUBJECTS[s].name}: ${SUBJECTS[s].std}`).join(' · ')}</div>
    <div class="row" style="margin-top:12px"><button class="btn orange right" data-auto="1" id="rpClose">Close</button></div>`;
  $('rpClose').onclick = () => { show('panel', false); if (P) Learn.attach(P.learn); };
  show('panel', true); AudioSys.sfx('page');
}
function settingsPanel(fromBattle){
  const p = P || loadGame();
  const render = () => {
    $('panelBody').innerHTML = `<h2>SETTINGS</h2>
      <div class="setRow"><span>Music</span><input type="range" min="0" max="1" step=".05" value="${AudioSys.musicVol}" id="sMusic"></div>
      <div class="setRow"><span>Sound effects</span><input type="range" min="0" max="1" step=".05" value="${AudioSys.sfxVol}" id="sSfx"></div>
      <div class="setRow"><span>Read questions aloud</span><button class="tgl ${Voice.on ? 'on' : ''}" id="sVoice"></button></div>
      ${P ? `<div class="setRow"><span>Screen shake</span><button class="tgl ${P.settings.shake ? 'on' : ''}" id="sShake"></button></div>
      <div class="setRow" style="display:block"><div style="margin-bottom:8px">Shift length (parent setting)</div><div class="seg" id="sShift">${[20, 30, 45, 60].map(m => `<button data-m="${m}" class="${P.shiftMin === m ? 'on' : ''}">${m} min</button>`).join('')}</div></div>` : ''}
      <div class="row" style="margin-top:16px">${fromBattle ? '<button class="btn ghost small" id="sQuit">Abandon mission</button>' : P && SCENE === 'map' ? '<button class="btn ghost small" id="sTitle">Save &amp; quit to title</button>' : ''}<button class="btn orange right" data-auto="1" id="sClose">${fromBattle ? 'Resume' : 'Close'}</button></div>`;
    $('sMusic').oninput = e => AudioSys.setMusic(+e.target.value);
    $('sSfx').oninput = e => { AudioSys.setSfx(+e.target.value); AudioSys.sfx('tap'); };
    $('sVoice').onclick = () => { Voice.on = !Voice.on; store.set('star-voice', Voice.on); render(); };
    if ($('sShake')) $('sShake').onclick = () => { P.settings.shake = !P.settings.shake; saveGame(); render(); };
    $('panelBody').querySelectorAll('#sShift button').forEach(b => b.onclick = () => { P.shiftMin = +b.dataset.m; saveGame(); updateHUD(); render(); });
    $('sClose').onclick = () => { show('panel', false); if (fromBattle) Battle.paused = false; };
    if ($('sQuit')) $('sQuit').onclick = async () => { show('panel', false); Battle.stop(); MISSION = null; show('bBtns', false); P.hull = Math.max(P.hull, maxHull() * .6); saveGame(); await backToMap(); };
    if ($('sTitle')) $('sTitle').onclick = () => { show('panel', false); P.lastEnd = Date.now(); saveGame(); SESSION = null; goTitle(); };
  };
  render(); show('panel', true);
}
function newGamePanel(){
  let grade = 7, shift = 30;
  const render = () => {
    $('panelBody').innerHTML = `<h2>NEW VOYAGE</h2><div class="sub">Questions adapt to the player automatically. Choose a starting level — it will adjust as you play.</div>
      <div style="font-weight:800;margin:6px 0 8px">Starting grade</div><div class="seg" id="ngGrade">${[6, 7, 8].map(gr => `<button data-g="${gr}" class="${grade === gr ? 'on' : ''}">Grade ${gr}</button>`).join('')}</div>
      <div style="font-weight:800;margin:16px 0 8px">Shift length <span style="color:#9FB3D9;font-weight:600">(how long one play session lasts)</span></div><div class="seg" id="ngShift">${[20, 30, 45, 60].map(m => `<button data-m="${m}" class="${shift === m ? 'on' : ''}">${m} min</button>`).join('')}</div>
      <div class="sub" style="margin-top:12px">${loadGame() ? '<b style="color:#FF9E40">Warning:</b> starting a new voyage replaces the current save.' : 'Progress saves automatically after every mission.'}</div>
      <div class="row" style="margin-top:14px"><button class="btn ghost small" id="ngBack">Back</button><button class="btn orange right" data-auto="1" id="ngGo">Launch</button></div>`;
    $('panelBody').querySelectorAll('#ngGrade button').forEach(b => b.onclick = () => { grade = +b.dataset.g; AudioSys.sfx('tap'); render(); });
    $('panelBody').querySelectorAll('#ngShift button').forEach(b => b.onclick = () => { shift = +b.dataset.m; AudioSys.sfx('tap'); render(); });
    $('ngBack').onclick = () => show('panel', false);
    $('ngGo').onclick = () => { show('panel', false); startNew(grade, shift); };
  };
  render(); show('panel', true);
}
function pauseMenu(){
  if (SCENE === 'battle'){ Battle.paused = true; settingsPanel(true); return; }
  settingsPanel(false);
}

/* ---------------- start / continue / title ---------------- */
async function startNew(grade, shift){
  P = newProfile(grade, shift); Learn.attach(P.learn); P.map = genMap(0); saveGame();
  startSession();
  show('title', false); SCENE = 'story'; AudioSys.play('story');
  await say(PROLOGUE);
  P.prologue = true; P.daily.last = today(); P.daily.streak = 1; saveGame();
  await infoPanel('HOW TO PLAY', `<div style="font-family:Lexend;line-height:1.6;font-size:16px">
    <b style="color:#5CE1FF">Fly:</b> drag anywhere on the screen (or use arrow keys / WASD). Your ship fires automatically.<br>
    <b style="color:#5CE1FF">Data Caches:</b> fly into the glowing DATA crystals. Answer the question: correct = choose a power-up card. Harder questions give rarer cards!<br>
    <b style="color:#5CE1FF">Streaks:</b> 3 correct in a row charges <b>Overdrive</b>. 5 in a row unlocks a <b>Codex</b> entry.<br>
    <b style="color:#5CE1FF">Guardians:</b> bosses raise Encryption Locks. Answer to shatter them.<br>
    <b style="color:#5CE1FF">Shifts:</b> your game saves after every mission. When your shift ends, take a break — you'll earn a Rested bonus!</div>`);
  await backToMap();
}
async function continueGame(){
  P = loadGame(); if (!P) return; Learn.attach(P.learn);
  if (!P.map) P.map = genMap(P.sector);
  startSession(); show('title', false);
  await backToMap();
  await dailyDrop();
}
function goTitle(ended){
  SCENE = 'title'; show('title', true); ['mapHud', 'mapBar', 'bBtns', 'nodeInfo'].forEach(id => show(id, false));
  const sv = loadGame();
  show('tContinue', !!sv);
  if (sv){
    const ago = sv.savedAt ? Math.round((Date.now() - sv.savedAt) / 60000) : 0;
    const restedReady = sv.lastEnd && Date.now() - sv.lastEnd >= 3600000;
    $('tInfo').innerHTML = `${SECTORS[sv.sector].name} · LV ${sv.level} · ${Math.min(7, sv.shards)}/7 Shards<br>${ended ? 'Shift saved. See you next time, Cadet!' : `Last played ${ago < 60 ? ago + ' min' : Math.round(ago / 60) + ' h'} ago`}${restedReady ? ' · <b>Rested bonus ready!</b>' : ''}`;
  } else $('tInfo').textContent = 'A space adventure where knowledge is your greatest weapon.';
  AudioSys.play('title');
}
function drawTitle(){
  const sec = { id: 'title', hue: 220, sky: ['#060A1A', '#141C48'], prop: 'none' };
  drawSpaceBG(g, W, H, sec, TT, TT * 30);
  drawPlanet(g, 120, 760, 150, 205, false, TT);
  g.save(); ell(g, 120, 760, 150, 150); g.clip(); g.fillStyle = 'rgba(80,200,120,.35)'; for (let i = 0; i < 6; i++){ ell(g, 60 + i * 40, 700 + Math.sin(i * 2) * 60, 40, 22, i); g.fill(); } g.restore();
  drawPlanet(g, 450, 420, 40, 300, true, TT);
  const sx = 330 + Math.sin(TT * .7) * 40, sy = 560 + Math.cos(TT * .9) * 20;
  for (let i = 0; i < 20; i++) glow(g, sx - i * 3, sy + 30 + i * 9, 10 - i * .4, '#FF9E40', .2);
  drawShip(g, sx, sy, 80, TT, { weapon: 'pulse', thrust: 1, tilt: Math.cos(TT * .7) * .4 });
  for (let i = 0; i < 4; i++) drawEnemy(g, 'drone', 80 + i * 40 + Math.sin(TT + i) * 10, 330 + Math.cos(TT * 1.3 + i) * 10, 10, TT, '#FF3D6E', 0);
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt;
  try { tick(dt); } catch (err){ console.error(err); window.__starErr = String(err && err.stack || err); }
  requestAnimationFrame(frame);
}
function tick(dt){
  g.clearRect(0, 0, W, H);
  tickDialogue(); tickQuestion();
  if (SESSION && P && (SCENE === 'map' || SCENE === 'battle' || SCENE === 'story') && !(SCENE === 'battle' && Battle.paused && !$('panel').hidden)){
    SESSION.activeMs += dt * 1000; P.stats.playMs += dt * 1000; const d = today(); P.playDays[d] = (P.playDays[d] || 0) + dt;
    if (!SESSION.warned && SESSION.activeMs >= P.shiftMin * 60000 * .8){ SESSION.warned = true; toast(`<b style="color:#5CE1FF">NOVA:</b> About ${Math.max(1, Math.round(P.shiftMin * .2))} minutes left in your shift. Let's finish strong!`, 4000); }
    if (Math.floor(TT * 2) !== Math.floor((TT - dt) * 2)) updateHUD();
  }
  if (SCENE === 'title' || SCENE === 'boot'){ drawTitle(); return; }
  if (SCENE === 'battle' && Battle.B){
    const steps = Math.max(1, Math.round(SPEED)); for (let i = 0; i < steps; i++) Battle.update(dt * SPEED / steps);
    if (Battle.B){
      if (!P.settings.shake) Battle.B.shake = 0;
      Battle.render(g, TT);
      const B = Battle.B; $('odRing').style.setProperty('--p', Math.round(B.od * 100)); $('btnOD').classList.toggle('ready', B.od >= 1 && B.odOn <= 0); $('bombN').textContent = B.bombs;
    }
    return;
  }
  if (P && P.map){ drawMap(dt); return; }
  drawTitle();
}

/* ---------------- input ---------------- */
function toStage(e){ const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / KS, y: (e.clientY - r.top) / KS }; }
cv.addEventListener('pointerdown', e => { AudioSys.init(); const p = toStage(e); if (SCENE === 'battle'){ Battle.pointerDown(p.x, p.y); cv.setPointerCapture(e.pointerId); } else if (SCENE === 'map') mapTap(p.x, p.y); });
cv.addEventListener('pointermove', e => { if (SCENE === 'battle'){ const p = toStage(e); Battle.pointerMove(p.x, p.y); } });
cv.addEventListener('pointerup', () => Battle.pointerUp()); cv.addEventListener('pointercancel', () => Battle.pointerUp());
document.addEventListener('pointerdown', () => AudioSys.init(), { capture: true });
addEventListener('keydown', e => {
  AudioSys.init();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  Battle.input.keys[k] = true;
  if (QS && !QS.answered && ['1', '2', '3', '4'].includes(k)){ const b = $('qChoices').children[+k - 1]; if (b && !b.classList.contains('gone')) b.click(); }
  if (QS && QS.answered && (k === 'Enter' || k === ' ')) { e.preventDefault(); closeQuestion(); }
  if (!$('dlg').hidden && (k === 'Enter' || k === ' ')){ e.preventDefault(); $('dlg').click(); }
  if (SCENE === 'battle' && !anyOverlay()){ if (k === ' ' || k === 'b') { e.preventDefault(); Battle.bomb(); } if (k === 'e' || k === 'Shift') Battle.overdrive(); if (k === 'Escape' || k === 'p') pauseMenu(); }
  if (k === 'h' && QS && !QS.answered) useHint();
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; Battle.input.keys[k] = false; });
addEventListener('blur', () => { Battle.input.keys = {}; });
addEventListener('pagehide', () => saveGame());
document.addEventListener('visibilitychange', () => { if (document.hidden){ saveGame(); if (SCENE === 'battle' && Battle.B && !Battle.paused && !anyOverlay()) pauseMenu(); } });

$('btnOD').onclick = () => Battle.overdrive();
$('btnBomb').onclick = () => Battle.bomb();
$('btnPause').onclick = () => pauseMenu();
$('qHint').onclick = () => useHint();
$('qNext').onclick = () => closeQuestion();
$('qSpk').onclick = () => { if (QS && !Voice.say(QS.Q.q)) toast('Read-aloud is not available on this device.'); };
$('niGo').onclick = () => { const n = SEL && nodeById(SEL); if (n){ AudioSys.sfx('warp'); launchNode(n); } };
$('niCancel').onclick = () => { show('nodeInfo', false); SEL = null; };
$('mbShip').onclick = () => shipPanel();
$('mbCrew').onclick = () => crewPanel();
$('mbCodex').onclick = () => codexPanel();
$('mbLog').onclick = () => reportPanel();
$('mbMenu').onclick = () => pauseMenu();
$('tNew').onclick = () => { AudioSys.init(); AudioSys.sfx('confirm'); newGamePanel(); };
$('tContinue').onclick = () => { AudioSys.init(); AudioSys.sfx('confirm'); continueGame(); };
$('tReport').onclick = () => { AudioSys.init(); reportPanel(loadGame()); };
$('tSettings').onclick = () => { AudioSys.init(); settingsPanel(false); };
$('tCodex').onclick = () => { AudioSys.init(); codexPanel(loadGame()); };

/* ---------------- test hooks ---------------- */
window.__star = {
  get P(){ return P; }, get SCENE(){ return SCENE; }, get QS(){ return QS; }, get B(){ return Battle.B; }, get SESSION(){ return SESSION; }, Battle, Learn, ITEMS, ITEM_LIST, MATH_GEN,
  fast(on = true){ TIME.fast = on; SPEED = on ? 8 : 1; },
  god(on = true){ GOD = on; },
  answer(right = true){ if (!QS || QS.answered) return false; const b = [...$('qChoices').children].find(x => right ? x.dataset.v === QS.Q.answer : x.dataset.v !== QS.Q.answer); b && b.click(); return true; },
  launch(type){ const av = availableNodes(); const n = (type && av.find(x => x.type === type)) || av[0]; if (!n) return null; selectNode(n); launchNode(n); return n.type; },
  available(){ return P && P.map ? availableNodes().map(n => n.type) : []; },
  startNew, continueGame, goTitle, genMap, ask, reportPanel, codexPanel, shipPanel, crewPanel, settingsPanel, shiftComplete,
  setShiftUsed(ms){ if (SESSION) SESSION.activeMs = ms; },
  icon(c, mask){ const x = c.getContext('2d'), N = c.width, k = N / 512; x.save(); x.scale(k, k);
    const gr = x.createRadialGradient(256, 200, 20, 256, 256, 380); gr.addColorStop(0, '#24306A'); gr.addColorStop(1, '#060A1A'); x.fillStyle = gr; x.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 60; i++){ x.fillStyle = `rgba(255,255,255,${.3 + hash2(i, 1) * .6})`; x.fillRect(hash2(i, 2) * 512, hash2(i, 3) * 512, 2, 2); }
    const m = mask ? .8 : 1; x.translate(256, 256); x.scale(m, m); x.translate(-256, -256);
    drawPlanet(x, 150, 390, 110, 205, false, 0); drawPlanet(x, 400, 130, 44, 300, true, 0);
    for (let i = 0; i < 14; i++) glow(x, 300 - i * 4, 330 + i * 12, 18 - i, '#FF9E40', .25);
    drawShip(x, 300, 270, 230, 0.3, { weapon: 'pulse', thrust: 1, tilt: -.6 }); x.restore(); },
};
const _dmg = Battle.damagePlayer.bind(Battle); Battle.damagePlayer = function(a){ if (GOD) return; return _dmg(a); };

/* ---------------- boot ---------------- */
fit();
goTitle();
requestAnimationFrame(frame);

Clips.setOk(() => AudioSys.sfxVol > .02);

})();
</script>

<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }</script>
</body>
